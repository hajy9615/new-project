<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--ARTIFACT-START-->
<title>제일 IR 플랫폼</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:url("fonts/PretendardVariable.woff2") format("woff2-variations")}
/* Layout: 짙은 남색 고정 메뉴(업무 영역 5개, 영역마다 고유 색) + 우측 작업 화면. 화면마다 영역 색의 머리띠(mast)가 열리고 그 아래 도구줄·패널이 이어짐. 860px 이하에서는 메뉴가 상단 가로 띠로 바뀜. */
:root{
  --blue:#0c419a; --blue2:#0571b0; --cyan:#1baacc; --green:#1a9431; --green2:#6eb92b; --lime:#b3dc10;
  --bg:#eef2f8; --surface:#fcfcfb; --surface2:#e8edf5; --fg:#0b1c3d; --muted:#51607c; --line:#d3dbe9;
  --navy:#06204f; --navy2:#0c419a; --on-navy:#eef3fc; --on-navy-m:#a9bbdc; --gold:#b3dc10; --gold-t:#4f6b00; --lime-t:#4f6b00;
  --accent:#0c419a; --accent-fg:#ffffff; --none:#9aa5b8; --lampbg:#0b1c3d;
  --a-main:#0c419a; --a-plan:#0571b0; --a-acc:#147a2a; --a-work:#0f7d94; --a-sd:#1b2f7a; --a-decide:#6b5a30; --a-ops:#55606e;
  --at-main:#0c419a; --at-plan:#0571b0; --at-acc:#147a2a; --at-work:#0b6e83; --at-sd:#1b2f7a; --at-decide:#6b5a30; --at-ops:#55606e;
  --st-A:#b3167f; --st-B:#d9560f; --st-C:#b87400; --st-D:#1f8f3e; --st-E:#1769b3; --st-F:#1c2f6f; --st-G:#6e3594;
  --stt-A:#b3167f; --stt-B:#c24a08; --stt-C:#8f5a00; --stt-D:#17762f; --stt-E:#1769b3; --stt-F:#1c2f6f; --stt-G:#6e3594;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --grid:#dfe5f0;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --good-t:#006300; --warn-t:#7a5200; --crit-t:#a82828;
  --stage-a:#1450b4; --stage-b:#06204f; --stage-c:#030c22; --stage-fg:#ffffff;
  --shadow:0 1px 2px rgba(11,28,61,.05),0 10px 28px rgba(11,28,61,.07);
  --display:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
  --dur-instant:120ms; --dur-fast:200ms; --dur-base:420ms; --dur-slow:760ms; --dur-cinema:1250ms;
  --ease-settle:cubic-bezier(0.16,1,0.3,1); --ease-glide:cubic-bezier(0.22,1,0.36,1); --ease-spring:cubic-bezier(0.34,1.4,0.5,1);
  --stagger-tight:40ms; --stagger-base:80ms; --shift-sm:12px; --scale-press:0.97;
  --area:var(--a-main); --area-t:var(--at-main);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070f1f; --surface:#141b29; --surface2:#1f2838; --fg:#f0efec; --muted:#b0bad0; --line:#2f3a50;
    --gold-t:#c8e84a; --lime-t:#c8e84a; --accent:#8fb4f5; --accent-fg:#0b1422; --none:#5d6880; --lampbg:#000814;
    --at-main:#8fb4f5; --at-plan:#6cc0f0; --at-acc:#6fd486; --at-work:#5fd0e6; --at-sd:#a9b6f7; --at-decide:#d9c58a; --at-ops:#b9c0cf;
    --stt-A:#f08cd0; --stt-B:#ff9d6b; --stt-C:#f2bd55; --stt-D:#6fd486; --stt-E:#7fb9f0; --stt-F:#a9b6f7; --stt-G:#c9a2e6;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --grid:#273247;
    --good-t:#62d062; --warn-t:#fab219; --crit-t:#f29090;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#070f1f; --surface:#141b29; --surface2:#1f2838; --fg:#f0efec; --muted:#b0bad0; --line:#2f3a50;
    --gold-t:#c8e84a; --lime-t:#c8e84a; --accent:#8fb4f5; --accent-fg:#0b1422; --none:#5d6880; --lampbg:#000814;
    --at-main:#8fb4f5; --at-plan:#6cc0f0; --at-acc:#6fd486; --at-work:#5fd0e6; --at-sd:#a9b6f7; --at-decide:#d9c58a; --at-ops:#b9c0cf;
    --stt-A:#f08cd0; --stt-B:#ff9d6b; --stt-C:#f2bd55; --stt-D:#6fd486; --stt-E:#7fb9f0; --stt-F:#a9b6f7; --stt-G:#c9a2e6;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --grid:#273247;
    --good-t:#62d062; --warn-t:#fab219; --crit-t:#f29090;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28); color-scheme:dark;
}
[data-area="main"]{--area:var(--a-main);--area-t:var(--at-main)}
[data-area="plan"]{--area:var(--a-plan);--area-t:var(--at-plan)}
[data-area="acc"]{--area:var(--a-acc);--area-t:var(--at-acc)}
[data-area="work"]{--area:var(--a-work);--area-t:var(--at-work)}
[data-area="sd"]{--area:var(--a-sd);--area-t:var(--at-sd)}
[data-area="decide"]{--area:var(--a-decide);--area-t:var(--at-decide)}
[data-area="ops"]{--area:var(--a-ops);--area-t:var(--at-ops)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 var(--body);word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
/* ---- 메뉴 ---- */
.side{background:linear-gradient(180deg,var(--navy2),var(--navy) 38%);color:var(--on-navy);padding:20px 12px 16px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow:auto;border-right:0;box-shadow:inset -1px 0 0 rgba(255,255,255,.08)}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 14px;border-bottom:1px solid color-mix(in oklab,var(--gold) 45%,transparent)}
.brand svg{flex:none;color:var(--gold)}
.brand b{font:800 18px/1.25 var(--display);display:block;letter-spacing:-.01em}
.brand span{font-size:11.5px;color:var(--on-navy-m);line-height:1.4;display:block}
.navs{display:flex;flex-direction:column;gap:12px}
.navg{display:flex;flex-direction:column;gap:1px}
.navg h6{margin:0 0 3px;padding:0 8px;font:700 11px/1.8 var(--body);letter-spacing:.08em;color:var(--on-navy-m);display:flex;align-items:center;gap:7px}
.navg h6 i{width:22px;height:22px;border-radius:6px;background:var(--area);display:grid;place-items:center;color:var(--on-navy);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 6px 37px;border-radius:8px;text-decoration:none;color:var(--on-navy);opacity:.86;position:relative;transition:background-color var(--dur-fast) var(--ease-glide),opacity var(--dur-fast) var(--ease-glide)}
.nav:hover{background:rgba(255,255,255,.08);opacity:1}
.nav[aria-current="page"]{background:rgba(255,255,255,.13);opacity:1;font-weight:700}
.nav[aria-current="page"]::before{content:"";position:absolute;left:16px;top:50%;width:7px;height:7px;margin-top:-3.5px;rotate:45deg;background:var(--gold)}
.nav .cnt{font-size:11px;background:var(--crit);color:#fff;border-radius:9px;padding:0 6px;line-height:18px;font-weight:700}
.rolebox{margin-top:auto;border-top:1px solid rgba(255,255,255,.14);padding:12px 6px 0;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--on-navy-m)}
.rolebox select{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:var(--on-navy)}
.rolebox option{color:#0e1b33;background:#fff}
/* ---- 본문 ---- */
.main{min-width:0;padding-block:22px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.mast{position:relative;overflow:hidden;border-radius:18px;color:#fff;padding:26px 28px 24px;display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap;
  background:radial-gradient(90% 140% at 100% 0%,color-mix(in oklab,var(--area) 55%,#fff 12%) 0%,transparent 60%),linear-gradient(118deg,var(--navy) 0%,var(--area) 62%,color-mix(in oklab,var(--area) 60%,var(--cyan)) 100%);box-shadow:var(--shadow)}
.mast::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.055) 0 1px,transparent 1px 22px);pointer-events:none}
.mast::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--gold),transparent 70%)}
.mast .sheen{display:none}
.mast-in{position:relative;min-width:0;max-width:74ch}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:700 12px/1 var(--body);letter-spacing:.14em;color:var(--gold);margin-bottom:10px}
.eyebrow::before{content:"";width:7px;height:7px;rotate:45deg;background:var(--gold)}
.mast h1{margin:0;font:800 32px/1.25 var(--display);letter-spacing:-.02em;text-wrap:balance}
.mast p{margin:8px 0 0;color:rgba(255,255,255,.86);font-size:14px}
.mast-meta{position:relative;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
.mast-meta b{font:700 13px var(--body);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 12px}
.mast-ico{position:absolute;right:-18px;top:-26px;width:210px;height:210px;color:#fff;opacity:.09;pointer-events:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sample{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed var(--serious);border-radius:10px;padding:7px 12px;font-size:12.5px;background:var(--surface)}
.sample b{color:var(--crit-t)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
@media (max-width:420px){.g2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.panel>h2{margin:0;font:700 16px/1.4 var(--display);display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:-.01em}
.panel>h2::before{content:"";flex:none;width:8px;height:8px;rotate:45deg;background:var(--area-t)}
.panel>h2 small{font:400 12px var(--body);color:var(--muted);letter-spacing:0}
.kpi{position:relative;gap:4px}
.panel.kpi{padding:16px 18px 14px;border-top:3px solid var(--area-t)}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.kpi .val{font:800 32px/1.2 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .val small{font:500 13px var(--body);color:var(--muted);margin-left:4px;letter-spacing:0}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi.has-ring{padding-right:84px}
.ring{position:absolute;right:16px;top:50%;translate:0 -50%;width:58px;height:58px;rotate:-90deg}
.ring circle{fill:none;stroke-width:7}
.ring .tr{stroke:var(--surface2)} .ring .arc{stroke:var(--area-t);stroke-linecap:round}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid var(--area-t)}
tbody th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
tbody tr:hover td{background:color-mix(in oklab,var(--area-t) 5%,transparent)}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:700;border-top:2px solid var(--fg);border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:21px;padding:0 9px;border-radius:11px;background:var(--surface2);white-space:nowrap;font-weight:500}
.pill.good{color:var(--good-t)} .pill.warn{color:var(--warn-t)} .pill.crit{color:var(--crit-t)}
.pill.good::before{content:"●"} .pill.warn::before{content:"▲"} .pill.crit::before{content:"■"}
.bar{display:grid;grid-template-columns:minmax(90px,200px) minmax(60px,1fr) 62px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:14px;background:var(--surface2);border-radius:0 5px 5px 0;position:relative}
.bar .fill{height:100%;background:linear-gradient(90deg,color-mix(in oklab,var(--s1) 78%,var(--surface)),var(--s1));border-radius:0 5px 5px 0;min-width:2px;transform-origin:left}
.bar .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.bars{display:flex;flex-direction:column;gap:9px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.legend i.d{border-top-style:dashed}
.legend i.sq{height:10px;border:0;border-radius:2px}
svg text{font:11px var(--body);fill:var(--muted)}
svg .lbl{fill:var(--fg);font-weight:700}
/* ---- 인포그래픽 부품 ---- */
.strip{display:flex;gap:2px;height:40px;border-radius:9px;overflow:hidden;transform-origin:left}
.strip span{display:block;min-width:3px}
.strip .hatch{background:repeating-linear-gradient(135deg,var(--serious) 0 5px,color-mix(in oklab,var(--serious) 35%,var(--surface)) 5px 10px)}
.strip-l{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.strip-l div{display:flex;flex-direction:column;gap:1px;font-size:12px;color:var(--muted);border-left:3px solid var(--c,var(--line));padding-left:9px}
.strip-l b{font:800 20px/1.3 var(--display);color:var(--fg);font-variant-numeric:tabular-nums}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px}
.rg{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12.5px;font-weight:500}
.rg svg{width:104px;height:104px}
.rg circle{fill:none;stroke-width:9}
.rg .tr{stroke:var(--surface2)} .rg .arc{stroke:var(--s1);stroke-linecap:round}
.rg .tick{stroke:var(--fg);stroke-width:2.5}
.rg text{font:800 19px var(--display);fill:var(--fg)}
.funnel{display:flex;flex-direction:column;gap:2px}
.fn{display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px}
.fn .fb{height:34px;margin:0 auto;border-radius:7px;background:linear-gradient(180deg,var(--s1),color-mix(in oklab,var(--s1) 78%,var(--navy)));min-width:8px}
.fn b{text-align:right;font-variant-numeric:tabular-nums}
.fn-c{text-align:center;font-size:11.5px;color:var(--muted);line-height:1.5}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{flex:1 1 130px;min-width:0;padding:12px 16px 12px 26px;background:color-mix(in oklab,var(--area-t) 12%,var(--surface));clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);display:flex;flex-direction:column;gap:0}
.step:first-child{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);border-radius:10px 0 0 10px;padding-left:16px}
.step.on{background:var(--area);color:#fff}
.step span{font-size:12px;opacity:.85}
.step b{font:800 24px/1.25 var(--display);font-variant-numeric:tabular-nums}
.quad{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.quad .ax{font-size:11.5px;color:var(--muted);text-align:center}
.quad .ay{grid-column:1/-1;text-align:left;font-weight:700;color:var(--fg)}
@media (max-width:560px){.quad{grid-template-columns:minmax(0,1fr)}.quad .ax{display:none}}
.qc{border-radius:12px;padding:12px;min-height:112px;display:flex;flex-direction:column;gap:8px;background:color-mix(in oklab,var(--qc) 11%,var(--surface));border:1px solid color-mix(in oklab,var(--qc) 35%,var(--line))}
.qc h3{margin:0;font:700 14px var(--display);display:flex;justify-content:space-between;gap:8px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.eq{font-size:13px;line-height:1.75}
.eqt td:nth-child(-n+4){white-space:nowrap}
.eq i{font-style:normal;font-weight:700;color:var(--area-t)}
input[type=range]{padding:0;border:0;background:none;height:30px;accent-color:var(--area-t)}
output{font-variant-numeric:tabular-nums;color:var(--area-t)}
button.opt{font:inherit;width:100%}
.flowing{stroke-dasharray:7 6}
/* ---- 입력·기타 ---- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 13px;cursor:pointer;transition:scale var(--dur-instant) var(--ease-glide),background-color var(--dur-fast) var(--ease-glide)}
.btn:hover{background:var(--surface2)}
.btn:active{scale:var(--scale-press)}
.btn.pri{background:var(--area);border-color:var(--area);color:#fff;font-weight:700}
.btn.pri:hover{background:color-mix(in oklab,var(--area) 86%,#000)}
.btn.sm{padding:2px 10px;font-size:12px}
.btn.danger{color:var(--crit-t)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px}
.tabs .btn{border-color:transparent;background:none}
.tabs .btn[aria-pressed="true"]{background:var(--area);color:#fff;font-weight:700}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.form label,.fl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form .wide{grid-column:1/-1}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0;width:100%}
textarea{min-height:72px;resize:vertical}
.doc{border:1px solid var(--fg);padding:22px;background:var(--surface);font-size:13px}
.doc h3{text-align:center;font:800 20px var(--display);margin:0 0 14px;letter-spacing:.3em}
.doc td,.doc th{border:1px solid var(--fg);color:var(--fg)}
.doc th{width:26%;background:var(--surface2);font-size:13px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.chk:last-child{border-bottom:0}
.msg{align-self:flex-start;max-width:80ch;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface)}
.msg.me{align-self:flex-end;background:color-mix(in oklab,var(--area-t) 13%,var(--surface));border-color:transparent}
.msg blockquote{margin:6px 0;padding:6px 10px;border-left:3px solid var(--area-t);background:var(--surface2)}
.msg .src{font-size:12px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:10px;min-height:220px}
.note{font-size:12px;color:var(--muted)}
.ins{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;background:var(--surface);box-shadow:var(--shadow)}
.ins h3{margin:0;font:700 15px/1.5 var(--display)}
.heat td.c{text-align:right}

body.dk #asst{display:block}
body.dk:not([data-view="desk"]) .win{display:flex;flex-direction:column;max-width:1320px;margin:0 auto;height:calc(100vh - 90px);height:calc(100dvh - 90px);background:var(--bg);border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.16),0 30px 80px rgba(2,10,30,.55)}
body.dk[data-view="cube"] .win,body.dk.max .win{max-width:none}
body.dk:not([data-view="desk"]) .winbody{display:block;flex:1;min-height:0;overflow:auto;padding:18px;scrollbar-gutter:stable}
body.dk:not([data-view="desk"]) #winbar{display:block;flex:none}
#winbar{background:var(--surface2);border-bottom:1px solid var(--line);font-size:13px}
.wb-tabs{display:flex;align-items:flex-end;gap:2px;padding:7px 8px 0;min-height:40px}
.wb-home,.wb-b{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;border:0;background:none;color:var(--muted);cursor:pointer;text-decoration:none;font-size:15px;line-height:1;margin-bottom:3px}
.wb-home:hover,.wb-b:hover{background:color-mix(in oklab,var(--fg) 9%,transparent);color:var(--fg)}
.wb-b[aria-pressed="true"]{color:var(--warn-t)}
.wb-tablist{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none;align-items:flex-end}
.wb-tab{display:flex;align-items:center;min-width:0;flex:0 1 190px;border-radius:10px 10px 0 0;color:var(--muted);border:1px solid transparent;border-bottom:0}
.wb-tab a{display:flex;align-items:center;gap:7px;min-width:0;flex:1;padding:8px 4px 8px 12px;color:inherit;text-decoration:none}
.wb-tab a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wb-tab svg{flex:none;color:var(--area-t)}
.wb-tab button{flex:none;width:22px;height:22px;margin-right:5px;border:0;border-radius:6px;background:none;color:inherit;cursor:pointer;opacity:.55}
.wb-tab button:hover{opacity:1;background:color-mix(in oklab,var(--fg) 10%,transparent)}
.wb-tab:hover{background:color-mix(in oklab,var(--surface) 60%,transparent)}
.wb-tab.on{background:var(--bg);color:var(--fg);font-weight:700;border-color:var(--line);box-shadow:inset 0 3px 0 var(--area-t)}
.wb-sp{flex:1}
.wb-addr{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--bg);border-top:1px solid var(--line);margin-top:-1px}
.wb-addr .wb-b{margin:0}
.wb-crumb{flex:1;min-width:0;display:flex;align-items:center;gap:7px;height:32px;padding:0 14px;border-radius:16px;background:var(--surface2);color:var(--muted);white-space:nowrap;overflow:hidden}
.wb-crumb svg{color:var(--area-t);flex:none}.wb-crumb b{color:var(--fg);overflow:hidden;text-overflow:ellipsis}.wb-crumb i{font-style:normal;opacity:.6}
.wb-find{flex:none;height:32px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--muted);padding:0 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.wb-find:hover{color:var(--fg);border-color:var(--area-t)}
kbd{font:600 11px var(--body);padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:var(--surface2);color:var(--muted)}
/* 작업 표시줄 */
#taskbar{position:fixed;z-index:30;left:0;right:0;bottom:0;height:62px;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));align-items:center;gap:8px;color:#eef3fc;background:rgba(4,16,44,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid rgba(255,255,255,.14)}
.tb-start{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:linear-gradient(135deg,rgba(27,170,204,.5),rgba(12,65,154,.6));color:#fff;font-weight:700;cursor:pointer;flex:none}
.tb-start:hover{border-color:var(--lime)}
.tb-apps{display:flex;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none;align-items:center}
.tb-app{position:relative;flex:none;display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 12px;border-radius:12px;color:#dbe6fa;text-decoration:none;font-size:13px;white-space:nowrap}
.tb-app:hover{background:var(--glass)}
.tb-app.open::after{content:"";position:absolute;left:50%;bottom:3px;width:14px;height:3px;border-radius:2px;translate:-50% 0;background:var(--cyan)}
.tb-app.on{background:var(--glass-l);color:#fff;font-weight:700}.tb-app.on::after{background:var(--lime);width:22px}
.tb-b{flex:none;height:36px;padding:0 12px;border-radius:10px;border:0;background:none;color:#dbe6fa;cursor:pointer;font-size:13px;white-space:nowrap}
.tb-b:hover{background:var(--glass);color:#fff}
.tb-logo{height:30px;width:auto;flex:none;margin-left:6px}
.tb-clock{flex:none;text-align:right;font-size:12px;line-height:1.35;font-variant-numeric:tabular-nums;color:#c6d4ef;min-width:92px}
.tb-clock b{display:block;font-size:14px;color:#fff}
/* 바탕화면 */
body.dk[data-view="desk"] .wrap{max-width:1640px}
.dk-wrap{display:grid;grid-template-columns:232px minmax(0,1fr) 336px;gap:26px;align-items:start;color:#fff;min-height:calc(100vh - 110px)}
body:not(.dk) .dk-wrap{background:linear-gradient(155deg,var(--wall-a),var(--wall-b) 60%,var(--wall-c));border-radius:18px;padding:22px;min-height:0}
.dk-icons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 4px;padding-top:6px}
.dk-ic{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 10px;border:1px solid transparent;border-radius:14px;background:none;color:#fff;cursor:pointer;text-decoration:none;font-size:13px;text-align:center;line-height:1.35;transition:background-color var(--dur-fast) var(--ease-glide),translate var(--dur-fast) var(--ease-settle)}
.dk-ic:hover,.dk-ic:focus-visible{background:var(--glass);border-color:rgba(255,255,255,.2);translate:0 -2px}
.dk-tile{position:relative;width:62px;height:54px;border-radius:13px;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:9px 8px 7px;background:linear-gradient(160deg,color-mix(in oklab,var(--area) 70%,#fff),var(--area));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 22px rgba(2,10,30,.4)}
.dk-tile::before{content:"";position:absolute;left:0;top:-6px;width:28px;height:11px;border-radius:7px 7px 0 0;background:color-mix(in oklab,var(--area) 62%,#fff)}
.dk-tile i{display:grid;place-items:center;border-radius:5px;background:rgba(255,255,255,.9);color:var(--area)}
.dk-tile i svg{width:11px;height:11px}
.dk-ic.one .dk-tile{display:grid;grid-template-columns:1fr;place-items:center;padding:0;background:linear-gradient(160deg,rgba(255,255,255,.96),rgba(226,236,250,.92));color:var(--area)}
.dk-ic.one .dk-tile::before{display:none}.dk-ic.one .dk-tile svg{width:26px;height:26px}
.dk-lab{text-shadow:0 1px 6px rgba(2,10,30,.6);font-weight:600}
.dk-hero h1{margin:0;font:800 clamp(22px,2.6vw,34px)/1.25 var(--display);letter-spacing:-.02em}
.dk-hero h1 em{font-style:normal;background:linear-gradient(90deg,#9be0f2,var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
.dk-hero p{margin:6px 0 0;color:#c6d4ef;font-size:14px;max-width:60ch}
.dk-eye{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--lime);margin-bottom:8px}
.dk-eye::before{content:"";width:22px;height:2px;background:var(--lime)}
.dk-mid{display:flex;flex-direction:column;gap:18px;min-width:0;padding-top:6px}
.dk-quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.dk-q{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:var(--glass);color:#fff;text-decoration:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:translate var(--dur-fast) var(--ease-settle),border-color var(--dur-fast)}
.dk-q:hover{translate:0 -3px;border-color:var(--lime)}
.dk-q>i{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.94);color:var(--area)}
.dk-q>i svg{width:19px;height:19px}
.dk-q b{display:block;font-size:14px}.dk-q span{font-size:12px;color:#c6d4ef}
.dk-card{border-radius:16px;padding:16px 18px;background:rgba(255,255,255,.96);color:#0b1c3d;box-shadow:0 14px 40px rgba(2,10,30,.35);display:flex;flex-direction:column;gap:10px;min-width:0}
.dk-card h2{margin:0;font:700 14px/1.4 var(--display);display:flex;align-items:center;gap:8px;justify-content:space-between}
.dk-card h2 small{font:500 12px var(--body);color:#51607c}
.dk-card a{color:inherit}
.dk-todo{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #e3e9f3;text-decoration:none;font-size:13.5px}
.dk-todo:first-of-type{border-top:0}
.dk-todo .n{flex:none;min-width:34px;height:26px;padding:0 8px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-variant-numeric:tabular-nums;background:#e8edf5;color:#0b1c3d}
.dk-todo.hot .n{background:#d03b3b;color:#fff}.dk-todo.do .n{background:#0c419a;color:#fff}.dk-todo.ok .n{background:#dff3df;color:#006300}
.dk-todo span{flex:1;min-width:0}.dk-todo::after{content:"›";color:#8a97b1;font-size:18px}
.dk-todo:hover span{text-decoration:underline}
.dk-chips{display:flex;flex-wrap:wrap;gap:6px}
.dk-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:var(--glass);color:#fff;text-decoration:none;font-size:13px}
.dk-chip:hover{border-color:var(--lime)}
.dk-sub{font-size:12px;font-weight:700;letter-spacing:.06em;color:#a9bbdc}
.dk-w{display:flex;flex-direction:column;gap:12px;min-width:0}
.dk-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dk-stat{font:800 28px/1.15 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:#0c419a}
.dk-stat small{font:600 13px var(--body);color:#51607c;margin-left:3px}
.dk-meter{height:6px;border-radius:3px;background:#e3e9f3;overflow:hidden}.dk-meter i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#0571b0,#1baacc)}
.dk-cap{font-size:12px;color:#51607c}
.dk-ring{display:flex;align-items:center;gap:14px}
.dk-ring svg{flex:none}
.dk-leg{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;font-size:12.5px;align-items:center;flex:1}
.dk-leg i{width:9px;height:9px;border-radius:50%}.dk-leg b{font-variant-numeric:tabular-nums;text-align:right}
.dk-feed{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid #e3e9f3;font-size:13px;text-decoration:none}
.dk-feed:first-of-type{border-top:0}
.dk-feed .tg{flex:none;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;background:#e8edf5;color:#0b1c3d;white-space:nowrap}
.dk-feed .tg.crit{background:#fbe3e3;color:#a82828}.dk-feed .tg.warn{background:#fdf0cf;color:#7a5200}
.dk-feed span:last-child{min-width:0}
.dk-more{align-self:flex-end;font-size:12.5px;font-weight:700;color:#0c419a!important;text-decoration:none}
/* 도우미 */
#asst{position:fixed;z-index:32;right:max(16px,env(safe-area-inset-right,0px));bottom:76px}
.as-btn{display:flex;align-items:center;gap:8px;height:46px;padding:0 16px 0 8px;border-radius:23px;border:1px solid rgba(255,255,255,.3);background:linear-gradient(135deg,#0571b0,#0c419a);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 10px 26px rgba(2,10,30,.45)}
.as-btn i,.as-face{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#fff;color:#0c419a;font-style:normal}
.as-card{width:min(332px,calc(100vw - 32px));border-radius:18px;padding:16px;background:rgba(255,255,255,.98);color:#0b1c3d;box-shadow:0 0 0 1px rgba(12,65,154,.14),0 22px 60px rgba(2,10,30,.5);display:flex;flex-direction:column;gap:10px}
.as-top{display:flex;gap:10px;align-items:center}.as-top b{font:700 15px/1.4 var(--display)}
.as-face{width:38px;height:38px;background:linear-gradient(135deg,#1baacc,#0c419a);color:#fff}
.as-find{display:flex;gap:6px}.as-find input{background:#fff;color:#0b1c3d;border-color:#d3dbe9}
.as-find button,.as-go{border:0;border-radius:9px;background:#0c419a;color:#fff;font-weight:700;padding:0 14px;cursor:pointer;white-space:nowrap}
.as-list{display:flex;flex-direction:column}
.as-list a,.as-list button{display:flex;align-items:center;gap:9px;padding:8px 6px;border:0;border-radius:8px;background:none;color:#0b1c3d;text-decoration:none;font:inherit;font-size:13.5px;text-align:left;cursor:pointer}
.as-list a::before,.as-list button::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:#1baacc}
.as-list a:hover,.as-list button:hover{background:#eef2f8}
.as-tip{font-size:12.5px;padding:9px 11px;border-radius:10px;background:#eef6e0;color:#3d5300}
.as-tip b{margin-right:6px}
.as-foot{display:flex;justify-content:space-between;gap:8px}
.as-foot button{border:1px solid #d3dbe9;border-radius:8px;background:#fff;color:#0b1c3d;padding:5px 12px;cursor:pointer;font-size:12.5px}
/* 겹침 창: 전체 메뉴·찾기·폴더·안내 */
#ovl{position:fixed;inset:0;z-index:40;display:grid;place-items:start center;padding:8vh 16px 80px;overflow:auto}
#ovl[hidden]{display:none}
.ov-back{position:fixed;inset:0;background:rgba(3,10,28,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.ov-card{position:relative;width:min(760px,100%);border-radius:18px;background:var(--surface);color:var(--fg);box-shadow:0 30px 90px rgba(2,10,30,.6);border:1px solid var(--line);overflow:hidden}
.ov-card.wide{width:min(980px,100%)}
.ov-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface2)}
.ov-head h2{margin:0;font:700 16px var(--display);flex:1;display:flex;align-items:center;gap:8px}
.ov-head h2 svg{color:var(--area-t)}
.ov-head input{flex:1;font-size:15px;height:40px}
.ov-body{padding:14px 16px 18px;max-height:min(66vh,640px);overflow:auto}
.ov-g{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin:12px 0 4px}
.ov-g:first-child{margin-top:0}
.ov-r{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--fg);text-decoration:none;cursor:pointer;border:0;background:none;width:100%;text-align:left;font:inherit}
.ov-r:hover,.ov-r.sel{background:var(--surface2)}
.ov-r.sel{box-shadow:inset 3px 0 0 var(--area-t)}
.ov-r>i{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:color-mix(in oklab,var(--area-t) 14%,var(--surface));color:var(--area-t)}
.ov-r b{display:block;font-size:14px}.ov-r small{display:block;color:var(--muted);font-size:12px}
.ov-r>span{min-width:0;flex:1}
.ov-apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.ov-step{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ov-step:first-child{border-top:0}
.ov-step>i{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--area);color:#fff;font:800 15px var(--display);font-style:normal}
.ov-step b{font-size:15px}.ov-step p{margin:2px 0 0;color:var(--muted);font-size:13px}
/* 업무 도구 공통 */
.callout{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);border:1px solid color-mix(in oklab,var(--area-t) 40%,var(--line));background:color-mix(in oklab,var(--area-t) 7%,var(--surface))}
.callout>i{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--area);color:#fff;font:800 14px var(--display);font-style:normal}
.callout b{font-weight:800}.callout p{margin:3px 0 0;color:var(--muted);font-size:13px}
.demo-tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:11px;background:var(--warn);color:#3d2900;font-size:12px;font-weight:700}
.stk{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--surface2)}
.stk i{display:block;height:100%}
.mini{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:8px;align-items:center}
.mini .track{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;position:relative}
.mini .track i{display:block;height:100%;border-radius:4px;background:var(--s1)}
.mini .track.warn i{background:var(--warn)}.mini .track.crit i{background:var(--crit)}.mini .track.good i{background:var(--good)}
.mini b{text-align:right;font-variant-numeric:tabular-nums}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.num{text-align:right;white-space:nowrap}
/* 서류 도우미 */
.dc-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.dc-p{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;color:var(--fg);font:inherit;box-shadow:var(--shadow);transition:translate var(--dur-fast) var(--ease-settle),border-color var(--dur-fast)}
.dc-p:hover{translate:0 -3px;border-color:var(--area-t)}
.dc-p>i{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:color-mix(in oklab,var(--area-t) 14%,var(--surface));color:var(--area-t);font:800 15px var(--display);font-style:normal}
.dc-p b{font:700 15px var(--display)}.dc-p span{font-size:12.5px;color:var(--muted)}
.dc-p em{font-style:normal;font-size:12px;color:var(--area-t);font-weight:700;margin-top:auto}
.dc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.dc-rows{display:flex;flex-direction:column;gap:6px}
.dc-row{display:grid;gap:6px;align-items:center}
.dc-row button{width:32px;height:32px;padding:0;justify-content:center}
.sheet{background:#fff;color:#111;border:1px solid #c9d1df;border-radius:6px;padding:34px 36px;font:13.5px/1.7 var(--body);box-shadow:0 8px 26px rgba(11,28,61,.12);min-height:420px;overflow-x:auto}
.sheet h3{margin:0 0 18px;text-align:center;font:800 21px/1.4 var(--display);letter-spacing:.12em;color:#111}
.sheet table{width:100%;border-collapse:collapse;margin:0 0 14px}
.sheet th,.sheet td{border:1px solid #333;padding:6px 9px;vertical-align:middle;color:#111;background:#fff}
.sheet th{background:#eef1f6;font-weight:700;text-align:center;white-space:nowrap}
.sheet .sig{height:34px;min-width:90px}
.sheet .pre{white-space:pre-wrap;margin:0;font:inherit}
.sheet .foot{margin-top:22px;text-align:center}
.sheet .blank{color:#9aa5b8}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 0}
.ck::before{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.ck.bad::before{content:"!";background:var(--crit)}.ck.ok::before{content:"✓";background:var(--good)}.ck.info::before{content:"i";background:var(--s1)}
/* 기준 묻기 */
.qa{display:flex;flex-direction:column;gap:12px}
.qa-q{align-self:flex-end;max-width:80%;padding:8px 14px;border-radius:14px 14px 4px 14px;background:var(--area);color:#fff;font-weight:600}
.qa-a{display:flex;flex-direction:column;gap:8px;max-width:92%}
.qa-c{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.qa-c h4{margin:0;font:700 14px var(--display);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qa-c dl{margin:0;display:grid;grid-template-columns:84px 1fr;gap:4px 10px;font-size:13px}
.qa-c dt{color:var(--muted)}.qa-c dd{margin:0;white-space:pre-line}
.qa-src{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;text-decoration:none}
.chip:hover,.chip.on{border-color:var(--area-t);color:var(--area-t);font-weight:700}
/* 용어 사전 */
.gl-wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.gl-side{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}
.gl-side button{display:flex;justify-content:space-between;gap:8px;padding:7px 12px;border:0;border-radius:9px;background:none;color:var(--fg);cursor:pointer;font:inherit;text-align:left}
.gl-side button:hover{background:var(--surface2)}.gl-side button.on{background:var(--area);color:#fff;font-weight:700}
.gl-side small{font-variant-numeric:tabular-nums;opacity:.75}
.gl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.gl-t{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;color:var(--fg);font:inherit}
.gl-t:hover{border-color:var(--area-t)}
.gl-t b{font:700 15px var(--display)}.gl-t span{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gl-def{font-size:16px;line-height:1.75}
.gl-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;font:700 15px var(--display)}
.gl-vs i{font-style:normal;font-size:12px;color:var(--muted)}
.gl-vs button{border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:8px;cursor:pointer;color:var(--fg);font:inherit}
/* 문의 게시판 */
.bd{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.bd:first-of-type{border-top:0}
.bd h4{margin:0;font:700 15px var(--display);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bd p{margin:0;white-space:pre-line;font-size:13.5px}
.bd .re{padding:10px 12px;border-radius:10px;background:color-mix(in oklab,var(--area-t) 8%,var(--surface));border-left:3px solid var(--area-t)}
@media (max-width:1180px){.dk-wrap{grid-template-columns:200px minmax(0,1fr)}.dk-w{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}}
@media (max-width:860px){
  body.dk .main{padding:8px 8px 72px}
  body.dk:not([data-view="desk"]) .win{height:auto;overflow:visible;border-radius:12px}
  body.dk:not([data-view="desk"]) .winbody{overflow:visible;padding:12px}
  .dk-wrap{grid-template-columns:minmax(0,1fr);gap:18px}
  .dk-icons{grid-template-columns:repeat(4,minmax(0,1fr));order:2}.dk-mid{order:1}.dk-w{order:3}
  .wb-find kbd,.tb-clock,.tb-b.tbo,.tb-start span,.tb-app span{display:none}
  .tb-app{padding:0 10px}.tb-start{padding:0 12px}
  .dc-grid,.gl-wrap{grid-template-columns:minmax(0,1fr)}
  .gl-side{position:static;flex-direction:row;overflow-x:auto}.gl-side button{flex:none}
  .sheet{padding:18px 14px}
}
@media (max-width:420px){.dk-icons{grid-template-columns:repeat(3,minmax(0,1fr))}.dk-two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){
  body.dk[data-view="desk"] .enter .dk-ic,body.dk[data-view="desk"] .enter .dk-card,body.dk[data-view="desk"] .enter .dk-q{animation:dkin var(--dur-base) var(--ease-settle) both;animation-delay:calc(var(--k,0)*22ms)}
  .ov-card{animation:dkin var(--dur-base) var(--ease-settle) both}
  .as-card{animation:dkin var(--dur-base) var(--ease-spring) both}
  @keyframes dkin{from{opacity:0;translate:0 14px;scale:.985}to{opacity:1;translate:0 0;scale:1}}
}
@media print{
  body.dk,body{background:#fff!important}
  body *{visibility:hidden}
  .sheet,.sheet *{visibility:visible}
  .win,.winbody{display:block!important;height:auto!important;overflow:visible!important;box-shadow:none!important}
  .sheet{position:absolute;left:0;top:0;width:100%;border:0;box-shadow:none;padding:0}
  #taskbar,#asst,#ovl,#winbar,.side{display:none!important}
}
/*EXT-CSS-END*/

function indFc(i,effort=0,target,H=5){const o=S.vals[i.id]||{},ys=Object.keys(o).map(Number).sort((a,b)=>a-b);if(!ys.length)return null;if(target===undefined)target=i.trend?null:tgt(i,ys[ys.length-1]+H);let g=0;
  if(ys.length>=2){const n=ys.length,mx=sum(ys)/n,my=sum(ys,y=>o[y])/n,den=sum(ys,y=>(y-mx)**2);g=den?sum(ys,y=>(y-mx)*(o[y]-my))/den:0}
  const y0=ys[ys.length-1],dt=.25;let x=o[y0];const out=[{y:y0,v:x}];
  for(let k=1;k<=H/dt;k++){const t=k*dt,need=target!=null&&(ach(x,target,i.dir)??100)<100;x+=dt*(g*Math.pow(.5,t/3)+(need?effort*(target-x)/2:0));if(i.unit!=="점"&&x<0)x=0;if(k%4===0)out.push({y:y0+k/4,v:x})}
  const hit=target==null?null:out.find(p=>ach(p.v,target,i.dir)>=100),end=out[out.length-1],a=ach(end.v,target,i.dir);
  return {g,out,n:ys.length,hit:hit?hit.y:null,lv:a==null?"none":a>=100?"good":a>=80?"warn":"crit",a}}

function lineChart({xs,series,fmt=v=>v,h=230,ref}){
  const W=640,L=52,Rr=64,T=14,B=28,vals=[...series.flatMap(s=>s.v.filter(v=>v!=null)),...(ref?[ref.v]:[])];let lo=Math.min(...vals),hi=Math.max(...vals);
  if(series.some(s=>s.zero))lo=Math.min(0,lo);const pad=(hi-lo)*.1||Math.abs(hi)*.1||1;if(!series.some(s=>s.zero))lo-=pad;hi+=pad;
  const x=i=>L+(W-L-Rr)*(xs.length>1?i/(xs.length-1):.5),y=v=>T+(h-T-B)*(1-(v-lo)/(hi-lo));let g="";
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${esc(fmt(v))}</text>`}
  const step=Math.ceil(xs.length/8);xs.forEach((l,i)=>{if(i%step===0||i===xs.length-1)g+=`<text x="${x(i)}" y="${h-8}" text-anchor="middle">${esc(l)}</text>`});
  if(ref)g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(ref.v)}" y2="${y(ref.v)}" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="2 4"/><text class="lbl" x="${W-Rr+6}" y="${y(ref.v)-5}">${esc(ref.n)}</text>`;
  const ends=[];let areaDone=false;
  for(const s of series){let d="",last=null,first=null;s.v.forEach((v,i)=>{if(v==null)return;d+=(d?"L":"M")+x(i)+" "+y(v);last=i;if(first==null)first=i});if(last==null)continue;
    if(!areaDone&&!s.dash&&!s.thin&&last>first){areaDone=true;g+=`<path class="area" d="${d}L${x(last)} ${y(lo)}L${x(first)} ${y(lo)}Z" fill="${s.c}" fill-opacity=".1"/>`}
    g+=`<path class="${s.dash?"fadein":"draw"}" ${s.dash?'stroke-dasharray="6 5"':'pathLength="1"'} d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.thin?1.5:2.5}" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.v.forEach((v,i)=>{if(v==null)return;g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${s.pts||i===last?4:0}" fill="${s.c}" stroke="var(--surface)" stroke-width="2"/><circle cx="${x(i)}" cy="${y(v)}" r="11" fill="transparent" data-tip="${esc(s.n+" · "+xs[i]+"\n"+fmt(v))}"/>`});
    if(s.label!==false)ends.push({y:y(s.v[last]),t:fmt(s.v[last]),x:x(last)})}
  ends.sort((a,b)=>a.y-b.y);for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<13)ends[i].y=ends[i-1].y+13;
  for(const e of ends)g+=`<text class="lbl" x="${e.x+8}" y="${e.y+4}">${esc(e.t)}</text>`;
  return `<svg viewBox="0 0 ${W} ${h}" role="img" style="width:100%;height:auto;max-width:100%">${g}</svg><div class="legend">${series.map(s=>`<span><i class="${s.dash?"d":""}" style="border-color:${s.c}"></i>${esc(s.n)}</span>`).join("")}</div>`}
function copy(text,el){const done=()=>{if(el)el.textContent="복사함. 엑셀에 붙여넣을 수 있음."};const fb=()=>{const t=document.createElement("textarea");t.value=text;document.body.append(t);t.select();try{document.execCommand("copy");done()}catch(e){}t.remove()};

V.cal=()=>{const [Y,M]=ui.calM.split("-").map(Number),first=new Date(Date.UTC(Y,M-1,1)),start=first.getUTCDay(),days=new Date(Date.UTC(Y,M,0)).getUTCDate(),E=evScope(),by=groupBy(E,"date"),cells=[];

function bandChart(xs,q,cur,fmt){const W=640,H=230,L=52,R=20,T=14,B=28,all=[...q[0],...q[4],...cur],lo=Math.min(...all)*.96,hi=Math.max(...all)*1.04||1,x=i=>L+(W-L-R)*i/(xs.length-1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const area=(a,b)=>"M"+a.map((v,i)=>x(i)+" "+y(v)).join("L")+"L"+b.map((v,i)=>x(i)+" "+y(v)).reverse().join("L")+"Z",line=a=>"M"+a.map((v,i)=>x(i)+" "+y(v)).join("L");let g="";
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`}xs.forEach((l,i)=>{g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${l}</text>`});
  g+=`<path class="area" d="${area(q[0],q[4])}" fill="var(--s1)" fill-opacity=".14"/><path class="area" d="${area(q[1],q[3])}" fill="var(--s1)" fill-opacity=".22"/><path class="fadein" d="${line(q[2])}" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-dasharray="5 4"/><path class="draw" pathLength="1" d="${line(cur)}" fill="none" stroke="var(--s1)" stroke-width="2.5"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" style="width:100%;height:auto">${g}</svg><div class="legend"><span><i style="border-color:var(--s1)"></i>지금 설정</span><span><i class="d" style="border-color:var(--s1)"></i>중앙값</span><span><i class="sq" style="background:color-mix(in oklab,var(--s1) 36%,var(--surface))"></i>25~75%</span><span><i class="sq" style="background:color-mix(in oklab,var(--s1) 14%,var(--surface))"></i>5~95%</span></div>`}
const SD_UNC=["eRet","eEmp","eFill","tq","te","tr","tfin","yrs"];
function sdMC(){const key="mc"+JSON.stringify([sdCalib().C,sd.lev]);if(sd.cache[key])return sd.cache[key];const {C}=sdCalib(),base=sdSim(sd.lev),x=yrX(base),idx=x.idx.filter((_,i)=>i%2===0),runs=[];let seed=7;const rnd=()=>(seed=(Math.imul(seed,1664525)+1013904223)>>>0)/4294967296;
  for(let n=0;n<150;n++){const ex={};for(const k of SD_UNC)ex[k]=C[k]*(.8+.4*rnd());ex.dem=C.dem+(rnd()-.5)*.02;try{const r=sdSim(sd.lev,ex,1);runs.push(idx.map(i=>r.S[i]))}catch(e){}}
  const qs=[.05,.25,.5,.75,.95].map(p=>idx.map((_,i)=>{const a=runs.map(r=>r[i]).sort((a,b)=>a-b);return a[Math.floor(p*(a.length-1))]}));return sd.cache[key]={xs:idx.map(i=>(S.year+base.t[i])+""),qs,cur:idx.map(i=>base.S[i]),n:runs.length}}

function agendas(){const out=[],L=scopeInds();
  for(const i of L.filter(i=>i.core)){const s=stInd(i),f=indFc(i);if(s.lv==="crit"||s.lv==="warn")out.push({id:"ind-"+i.id,lv:s.lv,title:`${i.name} 개선 대책`,why:[`${s.l.y}학년도 ${num(s.l.v)}${i.unit}, 목표 ${tT(i,s.l.y)} (달성률 ${p1(s.a)}%, ${s.g}등급)`,`담당부서 ${i.dept}`,f&&f.n>=2?`지금 추세면 5년 뒤 ${LV[f.lv]}`:"추세 계산에는 2개 학년도 이상의 실적이 필요함"],opts:["담당부서 개선계획 수립·점검","관련 전략의 투자 강도 조정","목표·산식 재검토"],link:["kpi","지표 관리"],go:i.id})}
  for(const a of scopeAcc()){const s=stAcc(a);if(s.lv==="crit"||s.lv==="warn")out.push({id:"acc-"+a.no,lv:s.lv,title:`인증 수치 지표 ${a.no} ${a.name} 충족 대책`,why:[`기준 ${a.text}, 최근 실적 ${num(s.l.v)}${a.unit} (${s.label})`,`담당부서 ${a.dept}`],opts:["충족 계획 수립과 분기별 점검","자원 우선 배정","산출 근거 자료 재확인"],link:["acc","인증 수치 지표"]})}
  const none=L.filter(i=>stInd(i).lv==="none"&&i.target!=null).length;if(none>=L.length/3)out.push({id:"data",lv:"warn",title:"실적 자료 수집 일정 확정",why:[`성과지표 ${L.length}개 중 ${none}개가 미입력`,"신호등과 예측은 실적이 있어야 계산됨"],opts:["부서별 제출 기한을 일정표에 등록","정보공시 자료를 일괄 올리기","분기별 입력 점검 회의 운영"],link:["admin","자료 올리기"]});
  const q=S.qual.filter(x=>x.judge==="미충족").length;if(q)out.push({id:"qual",lv:"crit",title:"서술 평가 항목 미충족 해소",why:[`미충족 판정 ${q}개`],opts:["요소별 담당부서 보완 계획 수립","근거자료 확보 기한 지정"],link:["qual","서술 평가 항목"]});
  const w=loadSim().filter(x=>x.w>0);if(w.length)out.push({id:"load",lv:"warn",title:"일정 몰림 조정",why:[`${w.map(x=>x.m).join(", ")}에 처리 가능 건수를 넘는 일정이 있음`],opts:["일정 분산","해당 달 담당 인력 보강"],link:["cal","일정표"]});
  try{const m0=sdM(sdSim(LEV0)),op=sdOpt();if(op[0]&&op[0].pay-sdPay(m0)>.5)out.push({id:"sd",lv:"warn",title:"전략 투자 재배분 방향 선택",why:[`현행 유지 시 8년 뒤 재학생 ${m0.dS>=0?"+":""}${p1(m0.dS)}%, 등록유지율 ${p1(m0.ret)}%, 취업률 ${p1(m0.emp)}% (모의)`,`총량 유지 재배분 최선 조합의 종합 점수 ${p1(op[0].pay)} (현행 ${p1(sdPay(m0))})`],opts:[...new Set(op.slice(0,3).map(o=>levText(o.lev)))],link:["sdlab","최적 방안 찾기"]})}catch(e){}

// 자료 올리기(사업 현황·자체평가·집행 기준)
function xImport(kind,rows){const g=(r,k)=>{for(const x in r)if(x.trim().replace(/\s/g,"")===k)return r[x];return ""},n=v=>{const s=String(v).replace(/[^\d.\-]/g,"");return s===""||isNaN(+s)?null:+s},t=v=>String(v??"").trim(),dt=v=>v instanceof Date?ymd(new Date(v.getTime()-v.getTimezoneOffset()*6e4)):t(v).replace(/[./]/g,"-").replace(/-$/,"").replace(/\s/g,"").slice(0,10);let ok=0,skip=0;
 if(kind==="biz"){const by={};for(const r of rows){const name=t(g(r,"사업명")),b=n(g(r,"예산"));if(!name||b==null){skip++;continue}const d=dt(g(r,"기준일")),date=/^\d{4}-\d{2}-\d{2}$/.test(d)?d:TODAY;(by[date]??=[]).push({area:t(g(r,"영역"))||"미분류",dept:t(g(r,"부서"))||"미지정",name,budget:b,spent:n(g(r,"집행액"))||0,status:t(g(r,"상태"))||"진행중",prog:n(g(r,"진도"))});ok++}
  for(const d in by){S.biz.snaps=S.biz.snaps.filter(s=>s.date!==d);S.biz.snaps.push({date:d,rows:by[d]})}S.biz.snaps.sort((a,b)=>a.date.localeCompare(b.date));xu.bizI=-1;return `사업 ${ok}건을 반영함(기준일 ${Object.keys(by).length}개).${skip?` 읽지 못한 ${skip}건은 제외함(사업명 또는 예산 없음).`:""}`}
 if(kind==="rev"){const L=[];for(const r of rows){const round=t(g(r,"차수")),item=t(g(r,"평가항목")),max=n(g(r,"배점")),score=n(g(r,"점수"));if(!round||!item||max==null||score==null){skip++;continue}L.push({round,area:t(g(r,"영역"))||"기타",item,max,score,op:t(g(r,"의견")),next:t(g(r,"차기확인사항"))});ok++}
  const rs=new Set(L.map(x=>x.round));S.rev=[...S.rev.filter(x=>!rs.has(x.round)),...L];return `평가항목 ${ok}건을 반영함(차수 ${rs.size}개).${skip?` 읽지 못한 ${skip}건은 제외함(차수·평가항목·배점·점수 필요).`:""}`}
 for(const r of rows){const item=t(g(r,"항목"));if(!item){skip++;continue}S.kb=S.kb.filter(k=>k.item!==item);S.kb.push({item,desc:t(g(r,"설명")),rule:t(g(r,"기준")),evid:t(g(r,"증빙")),note:t(g(r,"유의사항")),src:t(g(r,"출처"))});ok++}return `집행 기준 ${ok}건을 반영함.${skip?` 항목이 없는 ${skip}건은 제외함.`:""}`}
