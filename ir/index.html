<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--ARTIFACT-START-->
<title>제일 IR 플랫폼</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:url("fonts/PretendardVariable.woff2") format("woff2-variations")}
/* Layout: 짙은 남색 고정 메뉴(업무 영역 5개, 영역마다 고유 색) + 우측 작업 화면. 화면마다 영역 색의 머리띠(mast)가 열리고 그 아래 도구줄·패널이 이어짐. 860px 이하에서는 메뉴가 상단 가로 띠로 바뀜. */
:root{
  --blue:#0c419a; --blue2:#0571b0; --cyan:#1baacc; --green:#1a9431; --green2:#6eb92b; --lime:#b3dc10;
  --bg:#eef2f8; --surface:#fcfcfb; --surface2:#e8edf5; --fg:#0b1c3d; --muted:#51607c; --line:#d3dbe9;
  --navy:#06204f; --navy2:#0c419a; --on-navy:#eef3fc; --on-navy-m:#a9bbdc; --gold:#b3dc10; --gold-t:#4f6b00; --lime-t:#4f6b00;
  --accent:#0c419a; --accent-fg:#ffffff; --none:#9aa5b8; --lampbg:#0b1c3d;
  --a-main:#0c419a; --a-plan:#0571b0; --a-acc:#147a2a; --a-work:#0f7d94; --a-sd:#1b2f7a; --a-decide:#6b5a30; --a-ops:#55606e;
  --at-main:#0c419a; --at-plan:#0571b0; --at-acc:#147a2a; --at-work:#0b6e83; --at-sd:#1b2f7a; --at-decide:#6b5a30; --at-ops:#55606e;
  --st-A:#b3167f; --st-B:#d9560f; --st-C:#b87400; --st-D:#1f8f3e; --st-E:#1769b3; --st-F:#1c2f6f; --st-G:#6e3594;
  --stt-A:#b3167f; --stt-B:#c24a08; --stt-C:#8f5a00; --stt-D:#17762f; --stt-E:#1769b3; --stt-F:#1c2f6f; --stt-G:#6e3594;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --grid:#dfe5f0;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --good-t:#006300; --warn-t:#7a5200; --crit-t:#a82828;
  --stage-a:#1450b4; --stage-b:#06204f; --stage-c:#030c22; --stage-fg:#ffffff;
  --shadow:0 1px 2px rgba(11,28,61,.05),0 10px 28px rgba(11,28,61,.07);
  --display:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
  --dur-instant:120ms; --dur-fast:200ms; --dur-base:420ms; --dur-slow:760ms; --dur-cinema:1250ms;
  --ease-settle:cubic-bezier(0.16,1,0.3,1); --ease-glide:cubic-bezier(0.22,1,0.36,1); --ease-spring:cubic-bezier(0.34,1.4,0.5,1);
  --stagger-tight:40ms; --stagger-base:80ms; --shift-sm:12px; --scale-press:0.97;
  --area:var(--a-main); --area-t:var(--at-main);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070f1f; --surface:#141b29; --surface2:#1f2838; --fg:#f0efec; --muted:#b0bad0; --line:#2f3a50;
    --gold-t:#c8e84a; --lime-t:#c8e84a; --accent:#8fb4f5; --accent-fg:#0b1422; --none:#5d6880; --lampbg:#000814;
    --at-main:#8fb4f5; --at-plan:#6cc0f0; --at-acc:#6fd486; --at-work:#5fd0e6; --at-sd:#a9b6f7; --at-decide:#d9c58a; --at-ops:#b9c0cf;
    --stt-A:#f08cd0; --stt-B:#ff9d6b; --stt-C:#f2bd55; --stt-D:#6fd486; --stt-E:#7fb9f0; --stt-F:#a9b6f7; --stt-G:#c9a2e6;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --grid:#273247;
    --good-t:#62d062; --warn-t:#fab219; --crit-t:#f29090;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#070f1f; --surface:#141b29; --surface2:#1f2838; --fg:#f0efec; --muted:#b0bad0; --line:#2f3a50;
    --gold-t:#c8e84a; --lime-t:#c8e84a; --accent:#8fb4f5; --accent-fg:#0b1422; --none:#5d6880; --lampbg:#000814;
    --at-main:#8fb4f5; --at-plan:#6cc0f0; --at-acc:#6fd486; --at-work:#5fd0e6; --at-sd:#a9b6f7; --at-decide:#d9c58a; --at-ops:#b9c0cf;
    --stt-A:#f08cd0; --stt-B:#ff9d6b; --stt-C:#f2bd55; --stt-D:#6fd486; --stt-E:#7fb9f0; --stt-F:#a9b6f7; --stt-G:#c9a2e6;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --grid:#273247;
    --good-t:#62d062; --warn-t:#fab219; --crit-t:#f29090;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28); color-scheme:dark;
}
[data-area="main"]{--area:var(--a-main);--area-t:var(--at-main)}
[data-area="plan"]{--area:var(--a-plan);--area-t:var(--at-plan)}
[data-area="acc"]{--area:var(--a-acc);--area-t:var(--at-acc)}
[data-area="work"]{--area:var(--a-work);--area-t:var(--at-work)}
[data-area="sd"]{--area:var(--a-sd);--area-t:var(--at-sd)}
[data-area="decide"]{--area:var(--a-decide);--area-t:var(--at-decide)}
[data-area="ops"]{--area:var(--a-ops);--area-t:var(--at-ops)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 var(--body);word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
/* ---- 메뉴 ---- */
.side{background:linear-gradient(180deg,var(--navy2),var(--navy) 38%);color:var(--on-navy);padding:20px 12px 16px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow:auto;border-right:0;box-shadow:inset -1px 0 0 rgba(255,255,255,.08)}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 14px;border-bottom:1px solid color-mix(in oklab,var(--gold) 45%,transparent)}
.brand svg{flex:none;color:var(--gold)}
.brand b{font:800 18px/1.25 var(--display);display:block;letter-spacing:-.01em}
.brand span{font-size:11.5px;color:var(--on-navy-m);line-height:1.4;display:block}
.navs{display:flex;flex-direction:column;gap:12px}
.navg{display:flex;flex-direction:column;gap:1px}
.navg h6{margin:0 0 3px;padding:0 8px;font:700 11px/1.8 var(--body);letter-spacing:.08em;color:var(--on-navy-m);display:flex;align-items:center;gap:7px}
.navg h6 i{width:22px;height:22px;border-radius:6px;background:var(--area);display:grid;place-items:center;color:var(--on-navy);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 6px 37px;border-radius:8px;text-decoration:none;color:var(--on-navy);opacity:.86;position:relative;transition:background-color var(--dur-fast) var(--ease-glide),opacity var(--dur-fast) var(--ease-glide)}
.nav:hover{background:rgba(255,255,255,.08);opacity:1}
.nav[aria-current="page"]{background:rgba(255,255,255,.13);opacity:1;font-weight:700}
.nav[aria-current="page"]::before{content:"";position:absolute;left:16px;top:50%;width:7px;height:7px;margin-top:-3.5px;rotate:45deg;background:var(--gold)}
.nav .cnt{font-size:11px;background:var(--crit);color:#fff;border-radius:9px;padding:0 6px;line-height:18px;font-weight:700}
.rolebox{margin-top:auto;border-top:1px solid rgba(255,255,255,.14);padding:12px 6px 0;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--on-navy-m)}
.rolebox select{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:var(--on-navy)}
.rolebox option{color:#0e1b33;background:#fff}
/* ---- 본문 ---- */
.main{min-width:0;padding-block:22px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.mast{position:relative;overflow:hidden;border-radius:18px;color:#fff;padding:26px 28px 24px;display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap;
  background:radial-gradient(90% 140% at 100% 0%,color-mix(in oklab,var(--area) 55%,#fff 12%) 0%,transparent 60%),linear-gradient(118deg,var(--navy) 0%,var(--area) 62%,color-mix(in oklab,var(--area) 60%,var(--cyan)) 100%);box-shadow:var(--shadow)}
.mast::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.055) 0 1px,transparent 1px 22px);pointer-events:none}
.mast::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--gold),transparent 70%)}
.mast .sheen{display:none}
.mast-in{position:relative;min-width:0;max-width:74ch}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:700 12px/1 var(--body);letter-spacing:.14em;color:var(--gold);margin-bottom:10px}
.eyebrow::before{content:"";width:7px;height:7px;rotate:45deg;background:var(--gold)}
.mast h1{margin:0;font:800 32px/1.25 var(--display);letter-spacing:-.02em;text-wrap:balance}
.mast p{margin:8px 0 0;color:rgba(255,255,255,.86);font-size:14px}
.mast-meta{position:relative;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
.mast-meta b{font:700 13px var(--body);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 12px}
.mast-ico{position:absolute;right:-18px;top:-26px;width:210px;height:210px;color:#fff;opacity:.09;pointer-events:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sample{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed var(--serious);border-radius:10px;padding:7px 12px;font-size:12.5px;background:var(--surface)}
.sample b{color:var(--crit-t)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
@media (max-width:420px){.g2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.panel>h2{margin:0;font:700 16px/1.4 var(--display);display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:-.01em}
.panel>h2::before{content:"";flex:none;width:8px;height:8px;rotate:45deg;background:var(--area-t)}
.panel>h2 small{font:400 12px var(--body);color:var(--muted);letter-spacing:0}
.kpi{position:relative;gap:4px}
.panel.kpi{padding:16px 18px 14px;border-top:3px solid var(--area-t)}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.kpi .val{font:800 32px/1.2 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .val small{font:500 13px var(--body);color:var(--muted);margin-left:4px;letter-spacing:0}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi.has-ring{padding-right:84px}
.ring{position:absolute;right:16px;top:50%;translate:0 -50%;width:58px;height:58px;rotate:-90deg}
.ring circle{fill:none;stroke-width:7}
.ring .tr{stroke:var(--surface2)} .ring .arc{stroke:var(--area-t);stroke-linecap:round}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid var(--area-t)}
tbody th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
tbody tr:hover td{background:color-mix(in oklab,var(--area-t) 5%,transparent)}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:700;border-top:2px solid var(--fg);border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:21px;padding:0 9px;border-radius:11px;background:var(--surface2);white-space:nowrap;font-weight:500}
.pill.good{color:var(--good-t)} .pill.warn{color:var(--warn-t)} .pill.crit{color:var(--crit-t)}
.pill.good::before{content:"●"} .pill.warn::before{content:"▲"} .pill.crit::before{content:"■"}
.bar{display:grid;grid-template-columns:minmax(90px,200px) minmax(60px,1fr) 62px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:14px;background:var(--surface2);border-radius:0 5px 5px 0;position:relative}
.bar .fill{height:100%;background:linear-gradient(90deg,color-mix(in oklab,var(--s1) 78%,var(--surface)),var(--s1));border-radius:0 5px 5px 0;min-width:2px;transform-origin:left}
.bar .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.bars{display:flex;flex-direction:column;gap:9px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.legend i.d{border-top-style:dashed}
.legend i.sq{height:10px;border:0;border-radius:2px}
svg text{font:11px var(--body);fill:var(--muted)}
svg .lbl{fill:var(--fg);font-weight:700}
/* ---- 인포그래픽 부품 ---- */
.strip{display:flex;gap:2px;height:40px;border-radius:9px;overflow:hidden;transform-origin:left}
.strip span{display:block;min-width:3px}
.strip .hatch{background:repeating-linear-gradient(135deg,var(--serious) 0 5px,color-mix(in oklab,var(--serious) 35%,var(--surface)) 5px 10px)}
.strip-l{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.strip-l div{display:flex;flex-direction:column;gap:1px;font-size:12px;color:var(--muted);border-left:3px solid var(--c,var(--line));padding-left:9px}
.strip-l b{font:800 20px/1.3 var(--display);color:var(--fg);font-variant-numeric:tabular-nums}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px}
.rg{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12.5px;font-weight:500}
.rg svg{width:104px;height:104px}
.rg circle{fill:none;stroke-width:9}
.rg .tr{stroke:var(--surface2)} .rg .arc{stroke:var(--s1);stroke-linecap:round}
.rg .tick{stroke:var(--fg);stroke-width:2.5}
.rg text{font:800 19px var(--display);fill:var(--fg)}
.funnel{display:flex;flex-direction:column;gap:2px}
.fn{display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px}
.fn .fb{height:34px;margin:0 auto;border-radius:7px;background:linear-gradient(180deg,var(--s1),color-mix(in oklab,var(--s1) 78%,var(--navy)));min-width:8px}
.fn b{text-align:right;font-variant-numeric:tabular-nums}
.fn-c{text-align:center;font-size:11.5px;color:var(--muted);line-height:1.5}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{flex:1 1 130px;min-width:0;padding:12px 16px 12px 26px;background:color-mix(in oklab,var(--area-t) 12%,var(--surface));clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);display:flex;flex-direction:column;gap:0}
.step:first-child{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);border-radius:10px 0 0 10px;padding-left:16px}
.step.on{background:var(--area);color:#fff}
.step span{font-size:12px;opacity:.85}
.step b{font:800 24px/1.25 var(--display);font-variant-numeric:tabular-nums}
.quad{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.quad .ax{font-size:11.5px;color:var(--muted);text-align:center}
.quad .ay{grid-column:1/-1;text-align:left;font-weight:700;color:var(--fg)}
@media (max-width:560px){.quad{grid-template-columns:minmax(0,1fr)}.quad .ax{display:none}}
.qc{border-radius:12px;padding:12px;min-height:112px;display:flex;flex-direction:column;gap:8px;background:color-mix(in oklab,var(--qc) 11%,var(--surface));border:1px solid color-mix(in oklab,var(--qc) 35%,var(--line))}
.qc h3{margin:0;font:700 14px var(--display);display:flex;justify-content:space-between;gap:8px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.eq{font-size:13px;line-height:1.75}
.eqt td:nth-child(-n+4){white-space:nowrap}
.eq i{font-style:normal;font-weight:700;color:var(--area-t)}
input[type=range]{padding:0;border:0;background:none;height:30px;accent-color:var(--area-t)}
output{font-variant-numeric:tabular-nums;color:var(--area-t)}
button.opt{font:inherit;width:100%}
.flowing{stroke-dasharray:7 6}
/* ---- 입력·기타 ---- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 13px;cursor:pointer;transition:scale var(--dur-instant) var(--ease-glide),background-color var(--dur-fast) var(--ease-glide)}
.btn:hover{background:var(--surface2)}
.btn:active{scale:var(--scale-press)}
.btn.pri{background:var(--area);border-color:var(--area);color:#fff;font-weight:700}
.btn.pri:hover{background:color-mix(in oklab,var(--area) 86%,#000)}
.btn.sm{padding:2px 10px;font-size:12px}
.btn.danger{color:var(--crit-t)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px}
.tabs .btn{border-color:transparent;background:none}
.tabs .btn[aria-pressed="true"]{background:var(--area);color:#fff;font-weight:700}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.form label,.fl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form .wide{grid-column:1/-1}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0;width:100%}
textarea{min-height:72px;resize:vertical}
.doc{border:1px solid var(--fg);padding:22px;background:var(--surface);font-size:13px}
.doc h3{text-align:center;font:800 20px var(--display);margin:0 0 14px;letter-spacing:.3em}
.doc td,.doc th{border:1px solid var(--fg);color:var(--fg)}
.doc th{width:26%;background:var(--surface2);font-size:13px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.chk:last-child{border-bottom:0}
.msg{align-self:flex-start;max-width:80ch;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface)}
.msg.me{align-self:flex-end;background:color-mix(in oklab,var(--area-t) 13%,var(--surface));border-color:transparent}
.msg blockquote{margin:6px 0;padding:6px 10px;border-left:3px solid var(--area-t);background:var(--surface2)}
.msg .src{font-size:12px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:10px;min-height:220px}
.note{font-size:12px;color:var(--muted)}
.ins{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;background:var(--surface);box-shadow:var(--shadow)}
.ins h3{margin:0;font:700 15px/1.5 var(--display)}
.heat td.c{text-align:right}

/* 지표별 예측: 저량 = 지표값, 유량 = 추세 관성(3년마다 절반) + 개선 노력 × (목표 − 현재) ÷ 조정 기간 2년 */
function indFc(i,effort=0,target=i.target,H=5){const o=S.vals[i.id]||{},ys=Object.keys(o).map(Number).sort((a,b)=>a-b);if(!ys.length)return null;let g=0;
  if(ys.length>=2){const n=ys.length,mx=sum(ys)/n,my=sum(ys,y=>o[y])/n,den=sum(ys,y=>(y-mx)**2);g=den?sum(ys,y=>(y-mx)*(o[y]-my))/den:0}
  const y0=ys[ys.length-1],dt=.25;let x=o[y0];const out=[{y:y0,v:x}];
  for(let k=1;k<=H/dt;k++){const t=k*dt,need=target!=null&&(ach(x,target,i.dir)??100)<100;x+=dt*(g*Math.pow(.5,t/3)+(need?effort*(target-x)/2:0));if(i.unit!=="점"&&x<0)x=0;if(k%4===0)out.push({y:y0+k/4,v:x})}
  const hit=target==null?null:out.find(p=>ach(p.v,target,i.dir)>=100),end=out[out.length-1],a=ach(end.v,target,i.dir);
  return {g,out,n:ys.length,hit:hit?hit.y:null,lv:a==null?"none":a>=100?"good":a>=80?"warn":"crit",a}}

/* ============ 시스템 다이내믹스 엔진 (오일러, 계산 순서: 보조 → 유량 → 저량, 시간 단위: 년) ============ */
const SDLK={CLS:[[0.5,1.12],[0.8,1.05],[1,1],[1.2,0.93],[1.5,0.82],[2,0.7]]};
function sdLookup(p,x){if(x<=p[0][0])return p[0][1];for(let i=1;i<p.length;i++)if(x<=p[i][0]){const a=p[i-1],b=p[i];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0])}return p[p.length-1][1]}
const SDF={MIN:Math.min,MAX:Math.max,IF:(c,a,b)=>c?a:b,EXP:Math.exp,LN:Math.log,LOOKUP_CLS:x=>sdLookup(SDLK.CLS,x)};
const SD_STOCKS=[["S","재학생 수","명","S0",["intake"],["drop","grad"]],["Q","교육 여건·품질","지수","1",["qadj"],[]],["EM","취업률","비율","emp0",["eadj"],[]],["R","대학 평판","지수","1",["radj"],[]],["F","재정 여력","지수","1",["fadj"],[]]];
const SD_VARS0=[
 ["pool","입학자원 지수","지수","a","EXP(dem*t)"],
 ["inv","전략 투자 평균","배","a","(lA+lB+lC+lD+lE+lF+lG)/7"],
 ["fcon","투자 실효 계수","0~1","a","MIN(1,MAX(0.4,F))"],
 ["cls","전공 강좌당 학생수","명","a","cls0*(S/S0)/(1+0.15*(lC-1)*fcon)"],
 ["Qt","교육 여건 목표","지수","a","(1+0.12*(lE-1)*fcon+0.10*(lF-1)*fcon+0.08*(lC-1)*fcon)*LOOKUP_CLS(cls/cls0)"],
 ["qadj","품질 조정","지수/년","f","(Qt-Q)/tq"],
 ["ret","재학생 등록유지율","비율","a","MIN(0.99,ret0*(1+eRet*(Q-1)+0.06*(lG-1)*fcon))"],
 ["empT","취업률 목표","비율","a","MIN(0.98,emp0*(1+eEmp*(Q-1)+0.08*(lB-1)*fcon+0.04*(lG-1)*fcon))"],
 ["eadj","취업률 조정","비율/년","f","(empT-EM)/te"],
 ["Rt","평판 목표","지수","a","0.5*EM/emp0+0.5*ret/ret0"],
 ["radj","평판 조정","지수/년","f","(Rt-R)/tr"],
 ["fill","신입생 충원율","비율","a","MIN(1.1,fill0*(1+eFill*(R-1)))"],
 ["intake","신입생 유입","명/년","f","cap*pool*fill*(1+0.05*(lA-1)*fcon+0.05*(lD-1)*fcon)"],
 ["drop","중도탈락","명/년","f","S*(1-ret)"],
 ["grad","졸업","명/년","f","S*ret/yrs"],
 ["rev","등록금 수입 지수","지수","a","S/S0"],
 ["Ft","재정 여력 목표","지수","a","rev/(0.55+0.45*inv)"],
 ["fadj","재정 여력 변화","지수/년","f","(Ft-F)/tfin"]];
const SD_CONST={S0:["현재 재학생 수","명"],cap:["입학정원","명/년"],fill0:["현재 신입생 충원율","비율"],ret0:["현재 등록유지율","비율"],emp0:["현재 취업률","비율"],cls0:["현재 강좌당 학생수","명"],yrs:["평균 수업연한","년"],dem:["입학자원 변화율","/년"],
 lA:["전략 A 투자 강도","배"],lB:["전략 B 투자 강도","배"],lC:["전략 C 투자 강도","배"],lD:["전략 D 투자 강도","배"],lE:["전략 E 투자 강도","배"],lF:["전략 F 투자 강도","배"],lG:["전략 G 투자 강도","배"],
 tq:["품질 조정 기간","년"],te:["취업률 반영 기간","년"],tr:["평판 형성 기간","년"],tfin:["재정 조정 기간","년"],eRet:["품질–유지율 탄력성","무차원"],eEmp:["품질–취업률 탄력성","무차원"],eFill:["평판–충원율 탄력성","무차원"]};
function sdCompile(vars){const names=new Set(["t","DT",...SD_STOCKS.map(s=>s[0]),...Object.keys(SD_CONST),...vars.map(v=>v[0])]);
  return vars.map(v=>{const ex=v[4];if(/[^A-Za-z0-9_+\-*/().,<>=\s]/.test(ex))throw new Error(v[1]+": 쓸 수 없는 문자가 있음");const deps=[];
    const js=ex.replace(/[A-Za-z_][A-Za-z0-9_]*/g,m=>{if(/^\d/.test(m))return m;if(m in SDF)return "F."+m;if(!names.has(m))throw new Error(v[1]+": 모르는 이름 "+m);if(!deps.includes(m))deps.push(m);return "v."+m});
    let fn;try{fn=new Function("v","F","return ("+js+")")}catch(e){throw new Error(v[1]+": 산식 형식이 맞지 않음")}return {k:v[0],fn,deps}})}
function sdRun(C,tf,vars,dt=.125){const comp=sdCompile(vars),v={...C,DT:dt,t:0};for(const s of SD_STOCKS)v[s[0]]=s[3] in C?C[s[3]]:+s[3];
  const n=Math.round(tf/dt),keys=[...SD_STOCKS.map(s=>s[0]),...comp.map(c=>c.k)],out={t:[]};for(const k of keys)out[k]=[];

function agendas(){const out=[],L=scopeInds();
  for(const i of L.filter(i=>i.core)){const s=stInd(i),f=indFc(i);if(s.lv==="crit"||s.lv==="warn")out.push({id:"ind-"+i.id,lv:s.lv,title:`${i.name} 개선 대책`,why:[`${s.l.y}학년도 ${num(s.l.v)}${i.unit}, 목표 ${num(i.target)}${i.unit} (달성률 ${p1(s.a)}%, ${s.g}등급)`,`담당부서 ${i.dept}`,f&&f.n>=2?`지금 추세면 5년 뒤 ${LV[f.lv]}`:"추세 계산에는 2개 학년도 이상의 실적이 필요함"],opts:["담당부서 개선계획 수립·점검","관련 전략의 투자 강도 조정","목표·산식 재검토"],link:["kpi","성과지표 관리"],go:i.id})}
  for(const a of scopeAcc()){const s=stAcc(a);if(s.lv==="crit"||s.lv==="warn")out.push({id:"acc-"+a.no,lv:s.lv,title:`인증 정량지표 ${a.no} ${a.name} 충족 대책`,why:[`기준 ${a.text}, 최근 실적 ${num(s.l.v)}${a.unit} (${s.label})`,`담당부서 ${a.dept}`],opts:["충족 계획 수립과 분기별 점검","자원 우선 배정","산출 근거 자료 재확인"],link:["acc","인증 정량지표"]})}
  const none=L.filter(i=>stInd(i).lv==="none"&&i.target!=null).length;if(none>=L.length/3)out.push({id:"data",lv:"warn",title:"실적 자료 수집 일정 확정",why:[`성과지표 ${L.length}개 중 ${none}개가 미입력`,"신호등과 예측은 실적이 있어야 계산됨"],opts:["부서별 제출 기한을 캘린더에 등록","정보공시 자료를 일괄 올리기","분기별 입력 점검 회의 운영"],link:["admin","자료 올리기"]});
  const q=S.qual.filter(x=>x.judge==="미충족").length;if(q)out.push({id:"qual",lv:"crit",title:"정성 평가요소 미충족 해소",why:[`미충족 판정 ${q}개`],opts:["요소별 담당부서 보완 계획 수립","근거자료 확보 기한 지정"],link:["qual","정성 평가요소"]});
  const w=loadSim().filter(x=>x.w>0);if(w.length)out.push({id:"load",lv:"warn",title:"일정 몰림 조정",why:[`${w.map(x=>x.m).join(", ")}에 처리 가능 건수를 넘는 일정이 있음`],opts:["일정 분산","해당 달 담당 인력 보강"],link:["cal","캘린더"]});
  try{const m0=sdM(sdSim(LEV0)),op=sdOpt();if(op[0]&&op[0].pay-sdPay(m0)>.5)out.push({id:"sd",lv:"warn",title:"전략 투자 재배분 방향 선택",why:[`현행 유지 시 8년 뒤 재학생 ${m0.dS>=0?"+":""}${p1(m0.dS)}%, 등록유지율 ${p1(m0.ret)}%, 취업률 ${p1(m0.emp)}% (모의)`,`총량 유지 재배분 최선 조합의 종합 점수 ${p1(op[0].pay)} (현행 ${p1(sdPay(m0))})`],opts:[...new Set(op.slice(0,3).map(o=>levText(o.lev)))],link:["sdlab","정책 탐색"]})}catch(e){}
  return out.sort((a,b)=>(a.lv==="crit"?0:1)-(b.lv==="crit"?0:1)).slice(0,12)}

   ${d?`<div class="opt"><div><b>${esc(d.choice)}</b><div class="note">${esc(d.reason)} · ${esc(d.owner)} · 점검일 ${d.review}</div></div></div>`:mg()?`<form data-form="decide" data-id="${a.id}" data-title="${esc(a.title)}" style="display:flex;flex-direction:column;gap:8px">${a.opts.map((o,i)=>`<label class="opt"><input type="radio" name="o_${a.id}" id="o_${a.id}_${i}" value="${esc(o)}" required style="width:auto;margin-top:4px"><span>${esc(o)}</span></label>`).join("")}
    <div class="form"><label class="wide">결정 근거<input id="dr_${a.id}" required></label><label>담당부서<select id="do_${a.id}">${optD("")}</select></label><label>후속 점검일<input type="date" id="dd_${a.id}" required></label></div><div class="row"><button class="btn pri">결정 기록</button><label class="row note" style="gap:4px"><input type="checkbox" id="dc_${a.id}" style="width:auto" checked> 점검일을 캘린더에 등록</label></div></form>`:`<span class="note">담당자 권한에서 결정을 기록함.</span>`}</div>`}).join("")||`<div class="panel"><span class="note">현재 자료 기준으로 결정이 필요한 안건이 없음. 실적이 입력되면 신호등에 따라 안건이 만들어짐.</span></div>`}</div>
  <div class="panel"><h2>결정 기록<small>결정 → 이행 → 점검</small></h2><div class="tw"><table><thead><tr><th>결정일</th><th>안건</th><th>결정</th><th>근거</th><th>담당</th><th>점검일</th><th>이행</th></tr></thead><tbody>${[...S.decisions].reverse().map(d=>`<tr><td>${d.date}</td><td>${esc(d.title)}</td><td>${esc(d.choice)}</td><td>${esc(d.reason)}</td><td>${esc(d.owner)}</td><td>${d.review} ${d.result==="대기"&&d.review<TODAY?stPill("crit","경과"):""}</td>
   <td>${mg()?`<select data-act="dst" data-id="${d.id}" id="ds_${d.id}" aria-label="이행 상태" style="width:auto">${st.map(s=>`<option ${s===d.result?"selected":""}>${s}</option>`).join("")}</select>`:esc(d.result)}</td></tr>`).join("")||`<tr><td colspan="7" class="note">기록된 결정이 없음.</td></tr>`}</tbody></table></div></div>`};
function briefText(){const L=scopeInds(),core=L.filter(i=>i.core),c=cnt(L,stInd),cc=cnt(core,stInd),A=scopeAcc(),ca=cnt(A,stAcc),bad=L.filter(i=>["crit","warn"].includes(stInd(i).lv)).sort((a,b)=>stInd(a).a-stInd(b).a).slice(0,5),ag=agendas().filter(a=>!S.decisions.some(d=>d.aid===a.id)),up=upcoming(30),Ls=[],ga="가나다라마바사";

   "3. 결정이 필요한 사항",...(ag.length?ag.slice(0,5).map((a,k)=>` ${ga[k]}. ${a.title}: ${a.why[0]}`):[" 해당 없음"]),"","4. 일정",...(up.length?up.slice(0,5).map((e,k)=>` ${ga[k]}. ${e.date} ${e.title} (${e.dept||"전 부서"})`):[" 30일 안에 예정된 일정 없음"]));

  else if(a==="val"){if(t.value==="")delete (S.vals[d.id]||{})[S.year];else(S.vals[d.id]??={})[S.year]=+t.value;if(S.vals[d.id]&&!Object.keys(S.vals[d.id]).length)delete S.vals[d.id];sd.cache={};save();render()}
  else if(a==="idept"){ind(d.id).dept=t.value;const ac=S.acc.find(x=>x.ind===d.id);if(ac)ac.dept=t.value;save();render()}
  else if(a==="itarget"){ind(d.id).target=t.value===""?null:+t.value;sd.cache={};save();render()}
  else if(a==="qjudge"){S.qual.find(q=>q.id==d.id).judge=t.value;qlogPush();save();render()}else if(a==="qdept"){S.qual.find(q=>q.id==d.id).dept=t.value;save()}
  else if(a==="qev"){S.qual.find(q=>q.id==d.id).evidence=t.value;qlogPush();save();render()}else if(a==="qdate"){S.qual.find(q=>q.id==d.id).due=t.value;save();render()}else if(a==="qdue"){S.qdue=t.value;save();render()}
  else if(a==="dst"){S.decisions.find(x=>x.id==d.id).result=t.value;save();render()}
  else if(a==="setyear"){if(+t.value>2000){S.year=+t.value;save();render()}}
  else if(a==="sdc"){if(t.value!==""&&isFinite(+t.value)){const old={...sd.ov};sd.ov[d.k]=+t.value;sd.cache={};try{sdSim(LEV0,null,1);render()}catch(x){sd.ov=old;t.value="";t.placeholder="계산할 수 없는 값"}}}
  else if(a==="sdo"){sd.out=t.value;render()}});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target,v=id=>$("#"+id).value.trim(),k=f.dataset.form;
  if(k==="vadd"){const y=+v("va_y"),x=v("va_v");if(y>2000&&x!==""){(S.vals[f.dataset.id]??={})[y]=+x;sd.cache={};save();render()}}
  else if(k==="dadd"){const n=v("da_n");if(n&&!S.depts.includes(n)){S.depts.push(n);syncRole();save();render()}}
  else if(k==="eadd"){S.events.push({id:nid(S.events),date:ui.calSel,title:v("ea_t"),type:v("ea_y"),dept:v("ea_d"),ind:v("ea_i")});save();render()}
  else if(k==="decide"){const id=f.dataset.id,o=f.querySelector("input[type=radio]:checked");if(o){const rv=v("dd_"+id);S.decisions.push({id:nid(S.decisions),aid:id,date:TODAY,title:f.dataset.title,choice:o.value,reason:v("dr_"+id),owner:v("do_"+id),review:rv,result:"대기"});if($("#dc_"+id).checked)S.events.push({id:nid(S.events),date:rv,title:"결정 후속 점검: "+f.dataset.title,type:"회의",dept:v("do_"+id),ind:""});save();render()}}
  else if(k==="sdeq"){const key=f.dataset.k,ex=v("sdeq_in"),nv=(sd.vars||SD_VARS0).map(x=>x[0]===key?[x[0],x[1],x[2],x[3],ex]:x);try{sdRun({...sdCalib().C,...LEV0},8,nv);sd.vars=nv;sd.cache={};render()}catch(x){$("#sdeqmsg").textContent="적용하지 못함. "+x.message}}});
document.addEventListener("dragover",e=>{if(e.target.closest(".drop"))e.preventDefault()});
document.addEventListener("drop",e=>{const z=e.target.closest(".drop");if(z){e.preventDefault();upload(e.dataTransfer.files[0])}});
const tip=$("#tip");
document.addEventListener("pointermove",e=>{const t=e.target.closest?.("[data-tip]");if(!t||!t.dataset.tip){tip.hidden=true;return}tip.textContent=t.dataset.tip;tip.hidden=false;tip.style.left=Math.max(4,Math.min(innerWidth-tip.offsetWidth-4,e.clientX+12))+"px";tip.style.top=Math.max(4,e.clientY-tip.offsetHeight-10)+"px"});
syncRole();render(true);

</script>
