<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--ARTIFACT-START-->
<title>제일 IR 플랫폼</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:url("fonts/PretendardVariable.woff2") format("woff2-variations")}
/* Layout: 짙은 남색 고정 메뉴(업무 영역 5개, 영역마다 고유 색) + 우측 작업 화면. 화면마다 영역 색의 머리띠(mast)가 열리고 그 아래 도구줄·패널이 이어짐. 860px 이하에서는 메뉴가 상단 가로 띠로 바뀜. */
:root{
  --bg:#eef1f6; --surface:#fcfcfb; --surface2:#e9edf4; --fg:#0e1b33; --muted:#55607a; --line:#d5dbe7;
  --navy:#0b1d3c; --navy2:#12305f; --on-navy:#eef2fb; --on-navy-m:#a9b6d3; --gold:#d9b56a; --gold-t:#86641f;
  --accent:#173f7a; --accent-fg:#ffffff;
  --a-decide:#7a5516; --a-sd:#7a2338; --a-budget:#173f7a; --a-perf:#0f5b52; --a-insight:#57306f; --a-ops:#3d4756;
  --at-sd:#7a2338; --at-decide:#7a5516; --at-budget:#173f7a; --at-perf:#0f5b52; --at-insight:#57306f; --at-ops:#3d4756;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --grid:#e1e6ef;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-t:#006300; --warn-t:#7a5200; --crit-t:#a82828;
  --stage-a:#1c3d72; --stage-b:#0a1730; --stage-c:#050b18; --stage-fg:#ffffff;
  --shadow:0 1px 2px rgba(14,27,51,.05),0 8px 24px rgba(14,27,51,.06);
  --display:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
  --dur-instant:120ms; --dur-fast:200ms; --dur-base:420ms; --dur-slow:760ms; --dur-cinema:1250ms;
  --ease-settle:cubic-bezier(0.16,1,0.3,1); --ease-glide:cubic-bezier(0.22,1,0.36,1);
  --stagger-tight:40ms; --stagger-base:80ms; --shift-sm:12px; --scale-press:0.97;
  --area:var(--a-budget); --area-t:var(--at-budget);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a101c; --surface:#171c26; --surface2:#222a38; --fg:#f0efec; --muted:#b1b8c8; --line:#333c4d;
    --gold-t:#e0bf7a; --accent:#8db6f2; --accent-fg:#0b1422;
    --at-sd:#f2a6b7; --at-decide:#e3bd68; --at-budget:#8db6f2; --at-perf:#5fd0bd; --at-insight:#cda8ea; --at-ops:#b9c0cf;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --grid:#2a3242;
    --good-t:#62d062; --warn-t:#fab219; --crit-t:#f29090;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a101c; --surface:#171c26; --surface2:#222a38; --fg:#f0efec; --muted:#b1b8c8; --line:#333c4d;
  --gold-t:#e0bf7a; --accent:#8db6f2; --accent-fg:#0b1422;
  --at-sd:#f2a6b7; --at-decide:#e3bd68; --at-budget:#8db6f2; --at-perf:#5fd0bd; --at-insight:#cda8ea; --at-ops:#b9c0cf;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --grid:#2a3242;
  --good-t:#62d062; --warn-t:#fab219; --crit-t:#f29090;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
[data-area="sd"]{--area:var(--a-sd);--area-t:var(--at-sd)}
[data-area="decide"]{--area:var(--a-decide);--area-t:var(--at-decide)}
[data-area="budget"]{--area:var(--a-budget);--area-t:var(--at-budget)}
[data-area="perf"]{--area:var(--a-perf);--area-t:var(--at-perf)}
[data-area="insight"]{--area:var(--a-insight);--area-t:var(--at-insight)}
[data-area="ops"]{--area:var(--a-ops);--area-t:var(--at-ops)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 var(--body);word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
/* ---- 메뉴 ---- */
.side{background:linear-gradient(180deg,var(--navy2),var(--navy) 38%);color:var(--on-navy);padding:20px 12px 16px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--gold)}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 14px;border-bottom:1px solid color-mix(in oklab,var(--gold) 45%,transparent)}
.brand svg{flex:none;color:var(--gold)}
.brand b{font:800 18px/1.25 var(--display);display:block;letter-spacing:-.01em}
.brand span{font-size:11.5px;color:var(--on-navy-m);line-height:1.4;display:block}
.navs{display:flex;flex-direction:column;gap:12px}
.navg{display:flex;flex-direction:column;gap:1px}
.navg h6{margin:0 0 3px;padding:0 8px;font:700 11px/1.8 var(--body);letter-spacing:.08em;color:var(--on-navy-m);display:flex;align-items:center;gap:7px}
.navg h6 i{width:22px;height:22px;border-radius:6px;background:var(--area);display:grid;place-items:center;color:var(--on-navy);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 6px 37px;border-radius:8px;text-decoration:none;color:var(--on-navy);opacity:.86;position:relative;transition:background-color var(--dur-fast) var(--ease-glide),opacity var(--dur-fast) var(--ease-glide)}
.nav:hover{background:rgba(255,255,255,.08);opacity:1}
.nav[aria-current="page"]{background:rgba(255,255,255,.13);opacity:1;font-weight:700}
.nav[aria-current="page"]::before{content:"";position:absolute;left:16px;top:50%;width:7px;height:7px;margin-top:-3.5px;rotate:45deg;background:var(--gold)}
.nav .cnt{font-size:11px;background:var(--crit);color:#fff;border-radius:9px;padding:0 6px;line-height:18px;font-weight:700}
.rolebox{margin-top:auto;border-top:1px solid rgba(255,255,255,.14);padding:12px 6px 0;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--on-navy-m)}
.rolebox select{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:var(--on-navy)}
.rolebox option{color:#0e1b33;background:#fff}
/* ---- 본문 ---- */
.main{min-width:0;padding-block:22px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.mast{position:relative;overflow:hidden;border-radius:18px;color:#fff;padding:26px 28px 24px;display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap;
  background:radial-gradient(90% 140% at 100% 0%,color-mix(in oklab,var(--area) 55%,#fff 12%) 0%,transparent 60%),linear-gradient(120deg,var(--navy) 0%,var(--area) 70%);box-shadow:var(--shadow)}
.mast::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.055) 0 1px,transparent 1px 22px);pointer-events:none}
.mast::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--gold),transparent 70%)}
.mast .sheen{display:none}
.mast-in{position:relative;min-width:0;max-width:74ch}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:700 12px/1 var(--body);letter-spacing:.14em;color:var(--gold);margin-bottom:10px}
.eyebrow::before{content:"";width:7px;height:7px;rotate:45deg;background:var(--gold)}
.mast h1{margin:0;font:800 30px/1.25 var(--display);letter-spacing:-.02em;text-wrap:balance}
.mast p{margin:8px 0 0;color:rgba(255,255,255,.86);font-size:14px}
.mast-meta{position:relative;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
.mast-meta b{font:700 13px var(--body);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 12px}
.mast-ico{position:absolute;right:-18px;top:-26px;width:210px;height:210px;color:#fff;opacity:.09;pointer-events:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sample{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed var(--serious);border-radius:10px;padding:7px 12px;font-size:12.5px;background:var(--surface)}
.sample b{color:var(--crit-t)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
@media (max-width:420px){.g2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.panel>h2{margin:0;font:700 16px/1.4 var(--display);display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:-.01em}
.panel>h2::before{content:"";flex:none;width:8px;height:8px;rotate:45deg;background:var(--area-t)}
.panel>h2 small{font:400 12px var(--body);color:var(--muted);letter-spacing:0}
.kpi{position:relative;gap:4px}
.panel.kpi{padding:16px 18px 14px;border-top:3px solid var(--area-t)}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.kpi .val{font:800 32px/1.2 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .val small{font:500 13px var(--body);color:var(--muted);margin-left:4px;letter-spacing:0}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi.has-ring{padding-right:84px}
.ring{position:absolute;right:16px;top:50%;translate:0 -50%;width:58px;height:58px;rotate:-90deg}
.ring circle{fill:none;stroke-width:7}
.ring .tr{stroke:var(--surface2)} .ring .arc{stroke:var(--area-t);stroke-linecap:round}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid var(--area-t)}
tbody th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
tbody tr:hover td{background:color-mix(in oklab,var(--area-t) 5%,transparent)}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:700;border-top:2px solid var(--fg);border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:21px;padding:0 9px;border-radius:11px;background:var(--surface2);white-space:nowrap;font-weight:500}
.pill.good{color:var(--good-t)} .pill.warn{color:var(--warn-t)} .pill.crit{color:var(--crit-t)}
.pill.good::before{content:"●"} .pill.warn::before{content:"▲"} .pill.crit::before{content:"■"}
.bar{display:grid;grid-template-columns:minmax(90px,200px) minmax(60px,1fr) 62px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:14px;background:var(--surface2);border-radius:0 5px 5px 0;position:relative}
.bar .fill{height:100%;background:linear-gradient(90deg,color-mix(in oklab,var(--s1) 78%,var(--surface)),var(--s1));border-radius:0 5px 5px 0;min-width:2px;transform-origin:left}
.bar .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.bars{display:flex;flex-direction:column;gap:9px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.legend i.d{border-top-style:dashed}
.legend i.sq{height:10px;border:0;border-radius:2px}
svg text{font:11px var(--body);fill:var(--muted)}
svg .lbl{fill:var(--fg);font-weight:700}
/* ---- 인포그래픽 부품 ---- */
.strip{display:flex;gap:2px;height:40px;border-radius:9px;overflow:hidden;transform-origin:left}
.strip span{display:block;min-width:3px}
.strip .hatch{background:repeating-linear-gradient(135deg,var(--serious) 0 5px,color-mix(in oklab,var(--serious) 35%,var(--surface)) 5px 10px)}
.strip-l{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.strip-l div{display:flex;flex-direction:column;gap:1px;font-size:12px;color:var(--muted);border-left:3px solid var(--c,var(--line));padding-left:9px}
.strip-l b{font:800 20px/1.3 var(--display);color:var(--fg);font-variant-numeric:tabular-nums}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px}
.rg{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12.5px;font-weight:500}
.rg svg{width:104px;height:104px}
.rg circle{fill:none;stroke-width:9}
.rg .tr{stroke:var(--surface2)} .rg .arc{stroke:var(--s1);stroke-linecap:round}
.rg .tick{stroke:var(--fg);stroke-width:2.5}
.rg text{font:800 19px var(--display);fill:var(--fg)}
.funnel{display:flex;flex-direction:column;gap:2px}
.fn{display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px}
.fn .fb{height:34px;margin:0 auto;border-radius:7px;background:linear-gradient(180deg,var(--s1),color-mix(in oklab,var(--s1) 78%,var(--navy)));min-width:8px}
.fn b{text-align:right;font-variant-numeric:tabular-nums}
.fn-c{text-align:center;font-size:11.5px;color:var(--muted);line-height:1.5}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{flex:1 1 130px;min-width:0;padding:12px 16px 12px 26px;background:color-mix(in oklab,var(--area-t) 12%,var(--surface));clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);display:flex;flex-direction:column;gap:0}
.step:first-child{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);border-radius:10px 0 0 10px;padding-left:16px}
.step.on{background:var(--area);color:#fff}
.step span{font-size:12px;opacity:.85}
.step b{font:800 24px/1.25 var(--display);font-variant-numeric:tabular-nums}
.quad{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.quad .ax{font-size:11.5px;color:var(--muted);text-align:center}
.quad .ay{grid-column:1/-1;text-align:left;font-weight:700;color:var(--fg)}
@media (max-width:560px){.quad{grid-template-columns:minmax(0,1fr)}.quad .ax{display:none}}
.qc{border-radius:12px;padding:12px;min-height:112px;display:flex;flex-direction:column;gap:8px;background:color-mix(in oklab,var(--qc) 11%,var(--surface));border:1px solid color-mix(in oklab,var(--qc) 35%,var(--line))}
.qc h3{margin:0;font:700 14px var(--display);display:flex;justify-content:space-between;gap:8px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.eq{font-size:13px;line-height:1.75}
.eqt td:nth-child(-n+4){white-space:nowrap}
.eq i{font-style:normal;font-weight:700;color:var(--area-t)}
input[type=range]{padding:0;border:0;background:none;height:30px;accent-color:var(--area-t)}
output{font-variant-numeric:tabular-nums;color:var(--area-t)}
button.opt{font:inherit;width:100%}
.flowing{stroke-dasharray:7 6}
/* ---- 입력·기타 ---- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 13px;cursor:pointer;transition:scale var(--dur-instant) var(--ease-glide),background-color var(--dur-fast) var(--ease-glide)}
.btn:hover{background:var(--surface2)}
.btn:active{scale:var(--scale-press)}
.btn.pri{background:var(--area);border-color:var(--area);color:#fff;font-weight:700}
.btn.pri:hover{background:color-mix(in oklab,var(--area) 86%,#000)}
.btn.sm{padding:2px 10px;font-size:12px}
.btn.danger{color:var(--crit-t)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px}
.tabs .btn{border-color:transparent;background:none}
.tabs .btn[aria-pressed="true"]{background:var(--area);color:#fff;font-weight:700}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.form label,.fl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form .wide{grid-column:1/-1}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0;width:100%}
textarea{min-height:72px;resize:vertical}
.doc{border:1px solid var(--fg);padding:22px;background:var(--surface);font-size:13px}
.doc h3{text-align:center;font:800 20px var(--display);margin:0 0 14px;letter-spacing:.3em}
.doc td,.doc th{border:1px solid var(--fg);color:var(--fg)}
.doc th{width:26%;background:var(--surface2);font-size:13px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.chk:last-child{border-bottom:0}
.msg{align-self:flex-start;max-width:80ch;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface)}
.msg.me{align-self:flex-end;background:color-mix(in oklab,var(--area-t) 13%,var(--surface));border-color:transparent}
.msg blockquote{margin:6px 0;padding:6px 10px;border-left:3px solid var(--area-t);background:var(--surface2)}
.msg .src{font-size:12px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:10px;min-height:220px}
.note{font-size:12px;color:var(--muted)}
.ins{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;background:var(--surface);box-shadow:var(--shadow)}
.ins h3{margin:0;font:700 15px/1.5 var(--display)}
.heat td.c{text-align:right}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--navy);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;max-width:260px;white-space:pre-line;border:1px solid var(--gold)}
.tl{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl div{padding:5px 0;position:relative}
.tl div::before{content:"";position:absolute;left:-20px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--s1);border:2px solid var(--surface)}
.tl div.chg::before{background:var(--s2)}
.stage{position:relative;height:460px;border-radius:var(--r);background:radial-gradient(120% 95% at 50% 0%,var(--stage-a) 0%,var(--stage-b) 58%,var(--stage-c) 100%);overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none}
.stage canvas{display:block;width:100%;height:100%}
.stage .l3{position:absolute;transform:translate(-50%,-100%);font-size:11px;font-weight:700;pointer-events:none;white-space:nowrap;color:var(--stage-fg);text-shadow:0 1px 3px var(--stage-c),0 0 6px var(--stage-c)}
.stage .note{color:var(--stage-fg)}
.opt{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--fg)}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:5px;border:1px solid var(--line);display:block}
pre.brief{white-space:pre-wrap;font:13px/1.85 var(--body);margin:0;background:var(--surface2);padding:18px;border-radius:var(--r);border-left:3px solid var(--gold)}

const prog=id=>S.programs.find(p=>p.id===id);

function scopeTx(){const ids=new Set(scope().map(p=>p.id));return S.tx.filter(t=>ids.has(t.prog))}
function months(){const o=[];let d=new Date(S.period.start+"T00:00:00Z");const e=new Date(S.period.end+"T00:00:00Z");while(d<=e){o.push(d.toISOString().slice(0,7));d.setUTCMonth(d.getUTCMonth()+1)}return o}
function progress(){const a=+new Date(S.period.start),b=+new Date(S.period.end),n=Date.now();return Math.max(0,Math.min(1,(n-a)/(b-a)))*100}
function forecast(progs,txs){
  const ms=months(), by=Object.fromEntries(ms.map(m=>[m,0]));
  for(const t of txs){const m=t.date.slice(0,7);if(m in by)by[m]+=t.amount}
  const budget=sum(progs,p=>p.budget), nowM=ymd(new Date()).slice(0,7);
  const lastData=txs.length?txs.map(t=>t.date.slice(0,7)).sort().pop():ms[0];
  const cur=ms.includes(nowM)?nowM:(nowM>ms[ms.length-1]?null:ms[0]);
  let cut=cur?ms.indexOf(cur):ms.length; // cut 이전 달까지를 마감된 달로 봄
  if(lastData<(cur||"9999"))cut=Math.min(cut,ms.indexOf(lastData)+1);
  const done=ms.slice(0,cut), recent=done.slice(-3), rate=recent.length?sum(recent,m=>by[m])/recent.length:0;
  const actual=[];let c=0;ms.forEach((m,i)=>{c+=by[m];actual.push(i<cut||by[m]?c:null)});
  const spent=sum(txs,t=>t.amount), proj=[];let pc=sum(done,m=>by[m]);
  ms.forEach((m,i)=>{if(i<cut-1)proj.push(null);else if(i===cut-1)proj.push(pc);else{pc+=rate;proj.push(Math.max(pc,i===cut?spent:0))}});
  const end=Math.min(Math.max(pc,spent),Math.max(budget,spent));
  return {ms,by,actual,proj,budget,spent,rate,end,endRate:pct(end,budget),unused:Math.max(0,budget-end)};
}

    body:`예산은 쓰였으나 지표가 따라오지 않음. 연계 프로그램의 운영 방식 점검이 필요함.`,ev:k.progs.map(name),act:"프로그램 운영 결과와 지표 산식 점검",progs:k.progs});
  {const m=recMatch(),old=new Date();old.setDate(old.getDate()-R.recDays);const late=S.tx.filter(t=>!m.used.has(t.id)&&t.date<ymd(old)).sort((a,b)=>b.amount-a.amount);
   if(late.length)out.push({id:"rec",lv:"warn",type:"증빙 미확보",title:`집행 후 ${R.recDays}일이 지나도 영수증이 없는 건 ${late.length}건`,body:`합계 ${mil(sum(late,t=>t.amount))}백만원. 정산 때 한꺼번에 찾으면 누락 위험이 큼.`,ev:late.slice(0,3).map(t=>`${t.date} ${name(t.prog)} ${won(t.amount)}원`),act:"영수증 대조 화면에서 해당 건 등록",progs:[...new Set(late.map(t=>t.prog))]})}

function lineChart({xs,series,fmt=v=>v,h=230}){
  const W=640,L=52,Rr=64,T=14,B=28,vals=series.flatMap(s=>s.v.filter(v=>v!=null));
  let lo=Math.min(...vals),hi=Math.max(...vals);if(series.some(s=>s.zero))lo=0;const pad=(hi-lo)*.08||1;if(!series.some(s=>s.zero))lo-=pad;hi+=pad;
  const x=i=>L+(W-L-Rr)*(xs.length>1?i/(xs.length-1):.5),y=v=>T+(h-T-B)*(1-(v-lo)/(hi-lo));
  let g="";for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${esc(fmt(v))}</text>`}
  const step=Math.ceil(xs.length/7);xs.forEach((l,i)=>{if(i%step===0||i===xs.length-1)g+=`<text x="${x(i)}" y="${h-8}" text-anchor="middle">${esc(l)}</text>`});
  const ends=[];
  let areaDone=false;for(const s of series){let d="",last=null,first=null;s.v.forEach((v,i)=>{if(v==null)return;d+=(d?"L":"M")+x(i)+" "+y(v);last=i;if(first==null)first=i});
    if(!areaDone&&!s.dash&&!s.thin&&first!=null&&last>first){areaDone=true;g+=`<path class="area" d="${d}L${x(last)} ${y(lo)}L${x(first)} ${y(lo)}Z" fill="${s.c}" fill-opacity=".1"/>`}
    g+=`<path class="${s.dash?"fadein":"draw"}" ${s.dash?'stroke-dasharray="5 4"':'pathLength="1"'} d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.thin?1.5:2.5}" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.v.forEach((v,i)=>{if(v==null)return;g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===last&&!s.thin?4:0}" fill="${s.c}" stroke="var(--surface)" stroke-width="2"/><circle cx="${x(i)}" cy="${y(v)}" r="11" fill="transparent" data-tip="${esc(s.n+" · "+xs[i]+"\n"+fmt(v))}"/>`});
    if(last!=null&&s.label!==false)ends.push({y:y(s.v[last]),t:fmt(s.v[last]),x:x(last)})}
  ends.sort((a,b)=>a.y-b.y);for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<13)ends[i].y=ends[i-1].y+13;
  for(const e of ends)g+=`<text class="lbl" x="${e.x+8}" y="${e.y+4}">${esc(e.t)}</text>`;
  return `<svg viewBox="0 0 ${W} ${h}" role="img" style="width:100%;height:auto;max-width:100%">${g}</svg>
  <div class="legend">${series.map(s=>`<span><i class="${s.dash?"d":""}" style="border-color:${s.c}"></i>${esc(s.n)}</span>`).join("")}</div>`;
}

  <span class="track"><span class="fill" style="width:${Math.max(0,Math.min(100,r.v))}%;display:block${r.c?";background:"+r.c:""}"></span>${mark!=null?`<span class="mark" style="left:${Math.min(100,mark)}%"></span>`:""}</span><span class="v">${r.t??p1(r.v)+"%"}</span></div>`).join("")}</div>`}

function quadrant(pm){const cell=(c,lv)=>{const l=pm.filter(d=>d.cls===c);return `<div class="qc" style="--qc:var(--${lv})"><h3>${c}<span class="note">${l.length}개 · ${mil(sum(l,d=>d.p.budget))}백만원</span></h3><div class="chips">${l.map(d=>`<span class="chip" data-tip="${esc(`${d.p.name}\n예상 집행률 ${p1(d.end)}% · 달성률 ${d.ach==null?"–":p1(d.ach)+"%"}`)}">${d.p.id} ${esc(d.p.name)}</span>`).join("")||`<span class="note">해당 없음</span>`}</div></div>`};
  return `<div class="panel"><h2>한눈에 보는 배치<small>가로: 종료 시점 예상 집행률 · 세로: 연계 지표 달성률</small></h2><div class="quad"><div class="ax ay">달성률 90% 이상</div>${cell("집행 촉진","warn")}${cell("확대 검토","good")}<div class="ax ay">달성률 90% 미만</div>${cell("재설계 검토","crit")}${cell("성과 점검","warn")}<div class="ax">◀ 예상 집행률 ${S.rules.lowExec}% 미만</div><div class="ax">예상 집행률 ${S.rules.lowExec}% 이상 ▶</div></div></div>`}
function ringSm(v){v=Math.max(0,Math.min(100,v));return `<svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="tr" cx="32" cy="32" r="26"/><circle class="arc" cx="32" cy="32" r="26" pathLength="100" stroke-dasharray="${v} 100" style="--v:${v}"/></svg>`}
const REDUCE=matchMedia("(prefers-reduced-motion: reduce)").matches;
function enhance(nav){const v=$("#view");v.classList.toggle("enter",!!nav);[...v.children].forEach((el,i)=>el.style.setProperty("--i",i));
  $$(".bars",v).forEach(b=>[...b.children].forEach((el,i)=>el.style.setProperty("--i",i)));
  $$(".kpi",v).forEach(k=>{const val=$(".val",k);if(!val)return;const tn=val.firstChild,u=$("small",val)?.textContent||"";if(!tn||tn.nodeType!==3)return;const raw=tn.textContent.trim();if(!/^[\d,]+(\.\d+)?$/.test(raw))return;
    const num=+raw.replace(/,/g,""),dec=(raw.split(".")[1]||"").length;if(u==="%"&&k.classList.contains("panel")){k.classList.add("has-ring");k.insertAdjacentHTML("beforeend",ringSm(num))}
    if(nav&&!REDUCE){const t0=performance.now(),f=n=>n.toLocaleString("ko-KR",{minimumFractionDigits:dec,maximumFractionDigits:dec}),tick=t=>{const k2=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k2,4);tn.textContent=f(num*e);if(k2<1&&tn.isConnected)requestAnimationFrame(tick);else tn.textContent=raw};tn.textContent=f(0);requestAnimationFrame(tick)}})}

  <div class="panel"><h2>다가오는 준비 업무</h2>${up.map(t=>`<div class="chk"><span class="pill">${t.due}</span><span>${esc(t.text)}</span></div>`).join("")||`<span class="note">예정된 업무가 없음.</span>`}</div></div>`};
function groupBy(a,k){const o={};for(const x of a)(o[x[k]]??=[]).push(x);return o}
function fcChart(f){const lin=f.ms.map((m,i)=>f.budget*(i+1)/f.ms.length);
  return lineChart({xs:f.ms.map(m=>m.slice(2).replace("-",".")),fmt:v=>mil(v),series:[{n:"균등 집행 기준",c:"var(--muted)",v:lin,thin:true,zero:true,label:false},{n:"실제 누적(백만원)",c:"var(--s1)",v:f.actual},{n:"예측",c:"var(--s1)",v:f.proj,dash:true}]})}

let bTab="area";
V.budget=()=>{const ps=scope(),tx=scopeTx(),pr=progress();
  const rowsBy=k=>{const src=k==="item"?groupBy(tx,"item"):groupBy(ps,k);return Object.entries(src).map(([n,l])=>{if(k==="item"){return {n,b:null,s:sum(l,t=>t.amount),c:l.length}}const ids=new Set(l.map(p=>p.id)),t=tx.filter(t=>ids.has(t.prog));return {n,b:sum(l,p=>p.budget),s:sum(t,t=>t.amount),c:t.length}})};
  const rows=bTab==="prog"?ps.map(p=>{const t=tx.filter(t=>t.prog===p.id);return {n:p.name,sub:p.dept,b:p.budget,s:sum(t,t=>t.amount),c:t.length}}):rowsBy(bTab);
  const tb=sum(ps,p=>p.budget),ts=sum(tx,t=>t.amount),lab={area:"영역",dept:"부서",item:"비목",prog:"프로그램"};
  return head("예산·집행 현황","배정과 집행을 영역·부서·비목·프로그램 단위로 조회함. 기간 진도율은 "+p1(pr)+"%.",
   `<div class="tabs">${Object.entries(lab).map(([k,l])=>`<button class="btn" aria-pressed="${bTab===k}" data-act="btab" data-k="${k}">${l}별</button>`).join("")}</div>`)+`
  <div class="panel"><h2>영역별 예산 구성</h2>${strip(areaExec(ps,tx).map((r,i)=>({l:r.a,v:r.b,c:`var(--s${i%4+1})`})))}</div>
  <div class="panel"><h2>${lab[bTab]}별 배정·집행</h2><div class="tw"><table><thead><tr><th>${lab[bTab]}</th><th class="n">배정(백만원)</th><th class="n">집행(백만원)</th><th class="n">잔액(백만원)</th><th class="n">집행률</th><th class="n">건수</th><th>상태</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r.n)}${r.sub?`<div class="note">${esc(r.sub)}</div>`:""}</td><td class="n">${r.b==null?"–":mil(r.b)}</td><td class="n">${mil(r.s)}</td><td class="n">${r.b==null?"–":mil(r.b-r.s)}</td><td class="n">${r.b==null?p1(pct(r.s,ts))+"% <span class='note'>(구성비)</span>":p1(pct(r.s,r.b))+"%"}</td><td class="n">${r.c}</td><td>${r.b==null?"":execStatus(pct(r.s,r.b),pr)}</td></tr>`).join("")}
  <tr class="tot"><td>합계</td><td class="n">${mil(tb)}</td><td class="n">${mil(ts)}</td><td class="n">${mil(tb-ts)}</td><td class="n">${p1(pct(ts,tb))}%</td><td class="n">${tx.length}</td><td></td></tr></tbody></table></div>
  <span class="note">상태 기준: 집행률이 기간 진도율보다 10%p 넘게 낮으면 지연, 25%p 넘게 낮으면 위험.</span></div>
  <div class="grid g2"><div class="panel"><h2>월별 집행액<small>백만원</small></h2>${(()=>{const f=forecast(ps,tx);return lineChart({xs:f.ms.map(m=>m.slice(2).replace("-",".")),fmt:v=>mil(v),series:[{n:"월 집행액",c:"var(--s1)",v:f.ms.map(m=>f.by[m]||(m<=ymd(new Date()).slice(0,7)?0:null)),zero:true}]})})()}</div>
  <div class="panel"><h2>예산 변경 이력</h2><div class="tw"><table><thead><tr><th>일자</th><th>프로그램</th><th class="n">변경 전</th><th class="n">변경 후</th><th class="n">증감</th><th>사유</th></tr></thead><tbody>${S.changes.filter(c=>ps.some(p=>p.id===c.prog)).map(c=>`<tr><td>${c.date}</td><td>${esc(prog(c.prog)?.name||c.prog)}</td><td class="n">${mil(c.before)}</td><td class="n">${mil(c.after)}</td><td class="n">${p1(pct(c.after-c.before,c.before))}%</td><td>${c.reason?esc(c.reason):stPill("warn","사유 없음")}</td></tr>`).join("")||`<tr><td colspan="6" class="note">변경 이력이 없음.</td></tr>`}</tbody></table></div></div></div>`};

V.forecast=()=>{const ps=scope(),tx=scopeTx(),f=forecast(ps,tx),R=S.rules;
  const rows=ps.map(p=>{const g=forecast([p],tx.filter(t=>t.prog===p.id));return {p,g}}).sort((a,b)=>a.g.endRate-b.g.endRate);
  return head("집행 예측·경보",`최근 3개월 월평균 집행 속도가 사업 종료까지 유지된다고 보고 계산함. 경보 기준은 종료 시점 집행률 ${R.lowExec}% 미만.`)+`
  <div class="grid g4"><div class="panel kpi"><span class="lab">현재 집행률</span><span class="val">${p1(pct(f.spent,f.budget))}<small>%</small></span><span class="sub">${mil(f.spent)}백만원</span></div>
  <div class="panel kpi"><span class="lab">최근 3개월 월평균 집행</span><span class="val">${mil(f.rate)}<small>백만원</small></span><span class="sub">마감된 달 기준</span></div>
  <div class="panel kpi"><span class="lab">종료 시점 예상 집행률</span><span class="val">${p1(f.endRate)}<small>%</small></span><span class="sub">${f.endRate<R.lowExec?"경보 기준 미달":"기준 충족"}</span></div>
  <div class="panel kpi"><span class="lab">불용 예상액</span><span class="val">${mil(f.unused)}<small>백만원</small></span><span class="sub">배정의 ${p1(pct(f.unused,f.budget))}%</span></div></div>
  <div class="panel"><h2>누적 집행과 예측<small>백만원</small></h2>${fcChart(f)}</div>
  <div class="panel"><h2>프로그램별 종료 시점 예상<small>예상 집행률이 낮은 순</small></h2><div class="tw"><table><thead><tr><th>프로그램</th><th>부서</th><th class="n">현재 집행률</th><th class="n">예상 집행률</th><th class="n">불용 예상(백만원)</th><th class="n">기준 충족에 필요한 월 집행(백만원)</th><th>판정</th></tr></thead><tbody>

let aType="meet";const aForm={};
const ATYPES={meet:["회의비","회 의 록"],trip:["여비 정산","여 비 정 산 서"],fee:["전문가 수당","수 당 지 급 조 서"]};
function aChecks(){const f=aForm,R=S.rules,out=[],p=prog(f.prog),amt=+f.amount||0;const add=(lv,t)=>out.push({lv,t});
  if(!f.prog)add("crit","프로그램을 선택해야 함");if(!f.date)add("crit","집행일을 입력해야 함");if(amt<=0)add("crit","금액을 입력해야 함");
  if(f.date&&(f.date<S.period.start||f.date>S.period.end))add("crit",`집행일이 사업 기간(${S.period.start} ~ ${S.period.end}) 밖임`);
  if(f.date){const d=new Date(f.date+"T00:00:00").getDay();if(d===0||d===6)add("warn","집행일이 주말임. 사유를 적요에 기재할 것")}
  if(p&&amt>0){const left=p.budget-sum(S.tx.filter(t=>t.prog===p.id),t=>t.amount);if(amt>left)add("crit",`프로그램 잔액 ${won(left)}원을 초과함`)}
  if(f.vendor&&f.acct){const prev=S.tx.find(t=>t.vendor===f.vendor&&t.acct);if(prev&&prev.acct!=="AC-"+hash("a"+f.acct).slice(0,4)&&prev.acct!==f.acct)add("warn",`${f.vendor}의 기존 지급 계좌와 다름. 등록 계좌를 대조할 것`)}
  if(aType==="meet"){const n=+f.people||0;if(n<2)add("crit","참석 인원은 2명 이상이어야 함");else if(amt/n>R.meetHead)add("warn",`1인당 ${won(amt/n)}원으로 기준 ${won(R.meetHead)}원을 넘음`);
    if(!(f.title||"").trim())add("crit","회의명을 입력해야 함");if((f.body||"").trim().length<20)add("warn","회의 내용이 20자 미만임. 논의·결정 사항을 적을 것")}
  if(aType==="trip"){if(!f.place)add("crit","출장지를 입력해야 함");if(!f.from||!f.to)add("crit","출장 기간을 입력해야 함");else if(f.to<f.from)add("crit","출장 종료일이 시작일보다 빠름");
    if(!(f.body||"").trim())add("warn","출장 목적을 적을 것");if(!f.ev)add("warn","교통·숙박 증빙 첨부 여부를 확인할 것")}
  if(aType==="fee"){const h=+f.hours||0,u=+f.unit||0;if(h<=0||u<=0)add("crit","시간과 단가를 입력해야 함");else{if(h*u!==amt)add("crit",`시간×단가(${won(h*u)}원)가 금액과 다름`);if(u>R.feeHour)add("warn",`시간당 단가가 기준 ${won(R.feeHour)}원을 넘음`)}
    if(!(f.body||"").trim())add("warn","활동 내용을 적을 것");if(!f.ev)add("warn","결과물(의견서·확인서) 첨부 여부를 확인할 것")}
  return out}
function aDoc(){const f=aForm,p=prog(f.prog),r=(k,v)=>`<tr><th>${k}</th><td>${esc(v||"")}</td></tr>`;
  const sp={meet:r("회의명",f.title)+r("장소",f.place)+r("참석 인원",f.people?f.people+"명":"")+r("회의 내용",f.body),
    trip:r("출장지",f.place)+r("출장 기간",f.from&&f.to?f.from+" ~ "+f.to:"")+r("출장 인원",f.people?f.people+"명":"")+r("출장 목적",f.body),

  return `<div class="doc" id="docOut"><h3>${ATYPES[aType][1]}</h3><table>${r("사업명","AID 전환 중점 전문대학 지원사업")}${r("프로그램",p?p.name+" ("+p.dept+")":"")}${r("집행일",f.date)}${r("금액",f.amount?won(f.amount)+"원":"")}${r("지급처",f.vendor)}${sp}${r("적요",f.memo)}</table>

  const sp={meet:i("title","회의명")+i("place","장소")+i("people","참석 인원","number","min=0")+`<label class="wide">회의 내용<textarea id="a_body" data-f="body">${esc(f.body||"")}</textarea></label>`,

    fee:i("hours","활동 시간","number","min=0 step=0.5")+i("unit","시간당 단가(원)","number","min=0")+`<label class="wide">활동 내용<textarea id="a_body" data-f="body">${esc(f.body||"")}</textarea></label><label class="wide" style="flex-direction:row;align-items:center"><input id="a_ev" data-f="ev" type="checkbox" style="width:auto" ${f.ev?"checked":""}> 결과물(의견서·확인서)을 첨부함</label>`}[aType];
  return head("결재 도우미","값을 입력하면 서식이 만들어지고, 제출 전에 누락과 기준 위반을 먼저 점검함. 개인 성명·계좌번호는 저장하지 않음.",
   `<div class="tabs">${Object.entries(ATYPES).map(([k,v])=>`<button class="btn" aria-pressed="${aType===k}" data-act="atab" data-k="${k}">${v[0]}</button>`).join("")}</div>`)+`

   ${i("date","집행일","date")}${i("amount","금액(원)","number","min=0")}${i("vendor","지급처")}${i("acct","계좌 끝 4자리(대조용)","text","maxlength=4 inputmode=numeric")}${sp}
   <label class="wide">적요<input id="a_memo" data-f="memo" value="${esc(f.memo||"")}"></label></div>
   <div class="row"><button class="btn pri" data-act="adone">작성 완료 기록</button><label class="row note" style="gap:4px"><input type="checkbox" id="a_reg" style="width:auto"> 집행 내역에도 등록</label><button class="btn" data-act="acopy">서식 내용 복사</button>${self===top?`<button class="btn" data-act="print">인쇄</button>`:""}<button class="btn" data-act="aclear">비우기</button></div><span class="note" id="amsg"></span></div>
  <div class="panel"><h2>제출 전 점검</h2><div id="achk"></div><h2>서식 미리보기</h2><div id="adoc"></div></div></div>`};
function aRefresh(){const c=aChecks();$("#achk").innerHTML=c.length?c.map(x=>`<div class="chk">${stPill(x.lv,x.lv==="crit"?"보완 필요":"확인")}<span>${esc(x.t)}</span></div>`).join(""):`<div class="chk">${stPill("good","통과")}<span>점검 항목을 모두 통과함.</span></div>`;$("#adoc").innerHTML=aDoc()}

const chat=[];
function ask(q){q=q.trim();if(!q)return;S.stats.ask++;
  const sc=S.kb.map(e=>({e,s:e.k.filter(k=>q.includes(k)).length})).filter(o=>o.s>0).sort((a,b)=>b.s-a.s).slice(0,2);
  if(!sc.length)S.stats.miss.push(q.slice(0,60));chat.push({q,a:sc.map(o=>o.e)});save()}
V.guide=()=>head("집행 기준 안내","등록된 지침 원문에서 해당 부분을 찾아 그대로 보여줌. 원문에 없는 내용은 답하지 않으며, 승인·반려 판단도 하지 않음.")+`
  <div class="grid g2"><div class="panel"><h2>질문</h2><div class="chat">${chat.length?chat.map(c=>`<div class="msg me">${esc(c.q)}</div><div class="msg">${c.a.length?c.a.map(e=>`<b>${esc(e.t)}</b><blockquote>${esc(e.x)}</blockquote><div class="src">출처: ${esc(e.src)}</div>`).join(""):"등록된 지침에서 해당 내용을 찾지 못함. 사업단 담당자에게 문의할 것. 이 질문은 지침 보완 목록에 기록됨."}</div>`).join(""):`<span class="note">비목이나 상황을 입력함. 예: 회의비 증빙, 출장 여비, 자문료 단가</span>`}</div>
   <form class="row" id="askf"><input id="askq" placeholder="예: 회의비는 어떤 증빙이 필요한가" style="flex:1;width:auto" autocomplete="off"><button class="btn pri">찾기</button></form>
   <div class="row">${S.kb.map(e=>`<button class="btn sm" data-act="askq" data-q="${esc(e.t)}">${esc(e.t)}</button>`).join("")}</div></div>
  <div class="panel"><h2>등록된 지침<small>${S.kb.length}건</small></h2>${S.kb.map((e,i)=>`<div class="chk"><div style="flex:1"><b>${esc(e.t)}</b> <span class="note">${esc(e.k.join(", "))}</span><div>${esc(e.x)}</div><div class="note">출처: ${esc(e.src)}</div></div>${S.role==="manager"?`<button class="btn sm danger" data-act="kbdel" data-i="${i}">삭제</button>`:""}</div>`).join("")}
   ${S.role==="manager"?`<h2>지침 등록</h2><form class="form" id="kbf"><label>항목명<input id="kb_t" required></label><label>검색어(쉼표로 구분)<input id="kb_k" required></label><label class="wide">원문<textarea id="kb_x" required></textarea></label><label class="wide">출처(지침명·조항)<input id="kb_s" required></label><div><button class="btn pri">등록</button></div></form>`:""}</div></div>`;

let indSel=0;
V.indicators=()=>{const I=S.ind,r=I.rows[indSel],f=v=>r.unit==="천원"?won(v):p1(v),last=I.years.length-1;
  return head("성과지표 추이","정보공시 주요 지표의 연도별 추이를 비교군 평균과 함께 봄. 비교군은 자료·설정에서 올린 값을 따름.")+`
  <div class="panel"><h2>지표 요약<small>${I.years[last]}년 기준</small></h2><div class="tw"><table><thead><tr><th>지표</th><th class="n">본교</th><th class="n">비교군 평균</th><th class="n">차이</th><th class="n">전년 대비</th><th>판정</th><th></th></tr></thead><tbody>
  ${I.rows.map((x,i)=>{const d=x.our[last]-x.peer[last],y=x.our[last]-x.our[last-1],good=x.up?d>=0:d<=0,fx=v=>x.unit==="천원"?won(v):p1(v);
   return `<tr><td>${esc(x.name)} <span class="note">(${x.unit})</span></td><td class="n">${fx(x.our[last])}</td><td class="n">${fx(x.peer[last])}</td><td class="n">${d>=0?"+":""}${fx(d)}</td><td class="n">${y>=0?"+":""}${fx(y)}</td><td>${good?stPill("good","비교군 이상"):stPill("warn","비교군 미만")}</td><td><button class="btn sm" data-act="ind" data-i="${i}" aria-pressed="${i===indSel}">추이</button></td></tr>`}).join("")}</tbody></table></div></div>
  <div class="panel"><h2>${esc(r.name)}<small>${r.unit}${r.up?"":" · 낮을수록 좋음"}</small></h2>${lineChart({xs:I.years.map(String),fmt:f,series:[{n:"본교",c:"var(--s1)",v:r.our},{n:"비교군 평균",c:"var(--s2)",v:r.peer}]})}</div>`};

V.link=()=>{const ks=kpiLink(),W=640,H=320,L=48,B=36,T=14,Rr=20,x=v=>L+(W-L-Rr)*Math.min(v,120)/120,y=v=>T+(H-T-B)*(1-Math.min(v,120)/120);
  let g=`<rect x="${x(60)}" y="${y(60)}" width="${x(120)-x(60)}" height="${y(0)-y(60)}" fill="var(--crit)" opacity=".07"/><text x="${x(120)-6}" y="${y(0)-8}" text-anchor="end">집행 높음 · 성과 낮음 (점검 대상)</text>`;
  for(const v of [0,30,60,90,120]){g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text><line y1="${T}" y2="${H-B}" x1="${x(v)}" x2="${x(v)}" stroke="var(--grid)"/><text x="${x(v)}" y="${H-B+14}" text-anchor="middle">${v}</text>`}
  g+=`<line x1="${x(0)}" y1="${y(0)}" x2="${x(120)}" y2="${y(120)}" stroke="var(--muted)" stroke-dasharray="4 4"/><text x="${(L+W-Rr)/2}" y="${H-4}" text-anchor="middle">예산 집행률(%)</text><text transform="translate(12 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle">목표 달성률(%)</text>`;
  for(const k of ks){g+=`<circle cx="${x(k.exec)}" cy="${y(k.ach)}" r="6" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/><text class="lbl" x="${x(k.exec)+9}" y="${y(k.ach)+4}">${k.id}</text><circle cx="${x(k.exec)}" cy="${y(k.ach)}" r="14" fill="transparent" data-tip="${esc(`${k.name}\n집행률 ${p1(k.exec)}% · 달성률 ${p1(k.ach)}%`)}"/>`}
  return head("예산–성과 연계","프로그램 예산을 연계된 성과지표와 묶어, 쓴 만큼 성과가 따라오는지 확인함. 점선 아래로 멀어질수록 집행 대비 성과가 부족함.")+`
  <div class="grid g2"><div class="panel"><h2>집행률과 달성률</h2><svg viewBox="0 0 ${W} ${H}" role="img" style="width:100%;height:auto">${g}</svg></div>
  <div class="panel"><h2>지표별 연계 예산</h2><div class="tw"><table><thead><tr><th>지표</th><th>연계 프로그램</th><th class="n">예산(백만원)</th><th class="n">집행률</th><th class="n">달성률</th><th class="n">차이</th></tr></thead><tbody>
  ${ks.map(k=>{const d=k.ach-k.exec;return `<tr><td><b>${k.id}</b> ${esc(k.name)}</td><td>${k.progs.map(p=>esc(prog(p)?.name||p)).join("<br>")}</td><td class="n">${mil(k.budget)}</td><td class="n">${p1(k.exec)}%</td><td class="n">${p1(k.ach)}%</td><td class="n">${d>=0?"+":""}${p1(d)}%p ${d<=-S.rules.gap?stPill("warn","점검"):""}</td></tr>`}).join("")}</tbody></table></div>
  <span class="note">달성률이 집행률보다 ${S.rules.gap}%p 넘게 낮으면 점검 대상으로 표시하고 확인 과제에 올림.</span></div></div>`};

V.feedback=()=>{const st=["접수","진행","완료"],today=ymd(new Date()),mg=S.role==="manager";
  const list=[...S.feedback].sort((a,b)=>(a.status==="완료")-(b.status==="완료")||a.due.localeCompare(b.due));
  return head("환류 추적","위원 의견과 확인 과제를 담당·기한·조치·완료 증빙까지 이어서 관리함. 완료 처리에는 증빙 기재가 필요함.")+`
  <div class="panel"><h2>환류 진행 흐름</h2>${steps([...st.map(x=>[x,S.feedback.filter(f=>f.status===x).length+"건",x==="진행"]),["기한 경과",S.feedback.filter(f=>f.status!=="완료"&&f.due<today).length+"건"]])}</div>
  <div class="panel"><h2>과제 목록</h2><div class="tw"><table><thead><tr><th>출처</th><th>의견·과제</th><th>담당</th><th>기한</th><th>상태</th><th>완료 증빙</th></tr></thead><tbody>
  ${list.map(f=>`<tr><td>${esc(f.src)}</td><td style="min-width:240px">${esc(f.text)}</td><td>${esc(f.owner)}</td><td>${f.due} ${f.status!=="완료"&&f.due<today?stPill("crit","경과"):""}</td>
   <td>${mg?`<select data-act="fst" data-id="${f.id}" id="fs_${f.id}" aria-label="상태" style="width:auto">${st.map(s=>`<option ${s===f.status?"selected":""}>${s}</option>`).join("")}</select>`:stPill(f.status==="완료"?"good":"warn",f.status)}</td>
   <td>${mg?`<input data-act="fev" data-id="${f.id}" id="fe_${f.id}" value="${esc(f.evidence)}" placeholder="문서명·번호" aria-label="완료 증빙" style="min-width:150px">`:esc(f.evidence)}</td></tr>`).join("")}</tbody></table></div><span class="note" id="fmsg"></span>
  ${mg?`<h2>과제 추가</h2><form class="form" id="ff"><label>출처<input id="ff_s" required placeholder="점검 차수·회의명"></label><label>담당<input id="ff_o" required></label><label>기한<input id="ff_d" type="date" required></label><label class="wide">의견·과제<input id="ff_t" required></label><div><button class="btn pri">추가</button></div></form>`:""}</div>`};

V.evidence=()=>{const mg=S.role==="manager",miss=S.evid.filter(e=>!e.ok).length;
  return head("평가 증빙 묶음","성과지표마다 필요한 증빙을 연결해 두고 확보 여부를 관리함. 보고서 작성 때 목록을 그대로 복사해 씀.",`<button class="btn" data-act="evcopy">증빙 목록 복사</button>`)+`
  <div class="grid g4"><div class="panel kpi"><span class="lab">전체 증빙</span><span class="val">${S.evid.length}<small>건</small></span></div><div class="panel kpi"><span class="lab">확보</span><span class="val">${S.evid.length-miss}<small>건</small></span></div><div class="panel kpi"><span class="lab">미확보</span><span class="val">${miss}<small>건</small></span><span class="sub" id="evmsg"></span></div></div>
  <div class="grid g2">${S.kpis.map(k=>{const l=S.evid.filter(e=>e.kpi===k.id),m=l.filter(e=>!e.ok).length;return `<div class="panel"><h2>${k.id} ${esc(k.name)} ${m?stPill("warn","미확보 "+m):stPill("good","완비")}</h2>
   ${l.map(e=>`<label class="chk" style="cursor:${mg?"pointer":"default"}"><input type="checkbox" id="ev_${e.id}" data-act="evt" data-id="${e.id}" ${e.ok?"checked":""} ${mg?"":"disabled"} style="width:auto;margin-top:4px"><span>${esc(e.doc)}</span></label>`).join("")}
   ${mg?`<form class="row" data-form="evadd" data-k="${k.id}"><input id="eva_${k.id}" placeholder="증빙 추가" style="flex:1;width:auto" aria-label="${k.id} 증빙 추가"><button class="btn sm">추가</button></form>`:""}</div>`}).join("")}</div>`};

V.student=()=>{const cols=[["fill","신입생 충원율","%",true],["drop","중도탈락률","%",false],["sat","강의 만족도","점",true],["job","취업률","%",true],["ai","AI 교과 이수율","%",true]];
  const rng=Object.fromEntries(cols.map(c=>[c[0],[Math.min(...S.students.map(s=>s[c[0]])),Math.max(...S.students.map(s=>s[c[0]]))]]));
  const cell=(c,v)=>{const [lo,hi]=rng[c[0]];let t=hi>lo?(v-lo)/(hi-lo):.5;if(!c[3])t=1-t;return `<td class="c" style="background:color-mix(in oklab,var(--s1) ${Math.round(6+t*44)}%,var(--surface))" data-tip="${esc(c[1]+" "+v+c[2])}">${c[0]==="sat"?v.toFixed(2):p1(v)}</td>`};
  const avg=k=>sum(S.students,s=>s[k])/S.students.length;
  const risk=S.students.filter(s=>s.drop>avg("drop")&&s.sat<avg("sat"));
  return head("학생 성공 IR","학과 단위 집계만 다루며 개인 단위 자료는 싣지 않음. 색이 진할수록 양호함(중도탈락률은 낮을수록 진함).")+`
  <div class="panel"><h2>학과별 주요 지표</h2><div class="tw"><table class="heat"><thead><tr><th>학과</th>${cols.map(c=>`<th class="n">${c[1]}(${c[2]})</th>`).join("")}</tr></thead><tbody>
  ${S.students.map(s=>`<tr><td>${esc(s.dept)}</td>${cols.map(c=>cell(c,s[c[0]])).join("")}</tr>`).join("")}
  <tr class="tot"><td>평균</td>${cols.map(c=>`<td class="n">${c[0]==="sat"?avg(c[0]).toFixed(2):p1(avg(c[0]))}</td>`).join("")}</tr></tbody></table></div></div>
  <div class="grid g2"><div class="panel"><h2>중도탈락 발생 시점<small>전체 대비 구성비</small></h2>${bars(S.dropWhen.map(d=>({l:d[0],v:d[1],tip:d[0]+" "+d[1]+"%"})))}
   <span class="note">1학년 1학기 전후 비중이 높으면 입학 초기 적응 지원 시점을 앞당기는 근거가 됨.</span></div>
  <div class="panel"><h2>먼저 살필 학과</h2>${risk.length?risk.map(s=>`<div class="chk">${stPill("warn","확인")}<span><b>${esc(s.dept)}</b>: 중도탈락률 ${p1(s.drop)}%(평균 ${p1(avg("drop"))}%), 만족도 ${s.sat.toFixed(2)}점(평균 ${avg("sat").toFixed(2)}점), AI 교과 이수율 ${p1(s.ai)}%</span></div>`).join(""):`<span class="note">해당 학과가 없음.</span>`}
   <span class="note">기준: 중도탈락률이 평균보다 높고 만족도가 평균보다 낮은 학과. 학과 평가나 순위 산정에는 쓰지 않음.</span></div></div>
  <div class="grid g2"><div class="panel"><h2>조기 지원 흐름<small>선별 → 상담 → 지원 → 유지, 인원 집계</small></h2>${funnel(S.care.funnel)}
   <span class="note">선별은 IR이 맡고 상담·학습지원·학사 부서가 개입을 나누어 맡는 구조를 전제로 함. 단계 사이에서 인원이 크게 줄어드는 곳이 보완할 지점임.</span></div>
  <div class="panel"><h2>지원 프로그램 효과 추적</h2><div class="tw"><table><thead><tr><th>구분</th><th class="n">다음 학기 등록 유지율</th><th class="n">다음 학기 평점</th></tr></thead><tbody>${S.care.effect.map(x=>`<tr><td>${esc(x[0])}</td><td class="n">${p1(x[1])}%</td><td class="n">${x[2].toFixed(2)}</td></tr>`).join("")}</tbody></table></div>
   <span class="note">두 집단의 차이는 참고 수치임. 참여 여부가 무작위가 아니므로 차이 전체를 프로그램 효과로 볼 수 없음.</span></div></div>`};

V.insight=()=>{const mg=S.role==="manager",all=mg?insights():visibleInsights(),rv=id=>S.review[id]||"검토 전";
  return head("확인 과제","집행 기록을 서로 연결해, 문서 한 건씩 볼 때는 드러나지 않는 확인 과제를 근거와 함께 제시함. 담당자가 게시한 항목만 다른 권한에 보임.")+`
  ${mg?`<div class="grid g4">${["검토 전","게시","보류"].map(s=>`<div class="panel kpi"><span class="lab">${s}</span><span class="val">${all.filter(i=>rv(i.id)===s).length}<small>건</small></span></div>`).join("")}</div>`:""}

function simCalc(){const pm=progMetrics(),a=pm.find(d=>d.p.id===sim.from),b=pm.find(d=>d.p.id===sim.to);if(!a||!b||a===b)return null;
  const max=Math.max(0,a.g.budget-a.g.end),x=Math.max(0,Math.min(sim.amt*1e6,max)),tb=sum(pm,d=>d.g.budget),te=sum(pm,d=>d.g.end);
  const bEnd=b.g.end+x*b.end/100,te2=te+x*b.end/100;
  return {a,b,max,x,rows:[[a.p.name,a.g.budget,a.g.end,a.g.budget-x,a.g.end],[b.p.name,b.g.budget,b.g.end,b.g.budget+x,bEnd],["전체",tb,te,tb,te2]]}}
V.sim=()=>{const pm=progMetrics().sort((a,b)=>a.end-b.end);if(!pm.some(d=>d.p.id===sim.from))sim.from=pm[0]?.p.id||"";if(!pm.some(d=>d.p.id===sim.to)||sim.to===sim.from)sim.to=pm[pm.length-1]?.p.id||"";

function sdCalib(){const A=sum(S.programs,p=>p.budget)/1e6,E0=Math.min(sum(S.tx,t=>t.amount)/1e6,A*.999),f=forecast(S.programs,S.tx),r=Math.max(f.rate/1e6,A/240);

  for(let i=G.h.t.length?1:0;i<=L;i++){G.h.t.push(r.t[i]);G.h.rate.push(r.rate[i]*100);G.h.P.push(r.P[i]);G.h.rw.push(r.rw[i]*100);G.h.plan.push(r.plan[i]*100)}
  G.ends.push(...r.ends);G.log.push({from:G.t,to:tf,lev:{...G.lev},rate:Math.max(...r.rate)*100,rw:r.maxRw*100,B:r.B[L],W:r.W[L],P:r.P[L],Q:r.Q[L],lapse:sum(r.ends,e=>e.lapse)});G.init=r.state;G.t=tf;G.U=r.state.U}
V.sdgame=()=>{if(!sd.game)gameNew();const G=sd.game,done=G.t>=24-1e-9,st=new Date(S.period.start+"T00:00:00Z"),lab=t=>{const d=new Date(st);d.setUTCMonth(d.getUTCMonth()+Math.floor(t+1e-9));return d.toISOString().slice(0,7)};
  const last=G.log[G.log.length-1],cur=last||{B:G.C.B0,W:G.C.W0,P:G.C.P0,Q:1,rw:G.C.rw0*100,rate:G.C.E0/G.C.A*100};
  let fin="";if(done){const a=G.ends[0]||{},b=G.ends[1]||a,lap=sum(G.ends,e=>e.lapse),avgN=sum(G.log,l=>l.lev.nAdd)/G.log.length,my=b.P-lap/(2*G.C.A)*100-5*avgN,m0=sdM(sdSim(SD0)),base=sdPay(m0,SD0),best=sdOpt()[0],mxk=Math.max(...G.log.map(l=>l.lev.k)),mxrw=Math.max(...G.log.map(l=>l.rw)),tips=[];
    if(mxrw>18)tips.push("재작업률이 "+p1(mxrw)+"%까지 올랐음. 대기 업무가 쌓여 부하가 커지면 처리량이 오히려 줄어듦(R1 서두름의 악순환).");
    if(mxk>=2&&b.Q<.95)tips.push("독려를 강하게 쓴 구간에서 운영 품질이 "+b.Q.toFixed(2)+"로 내려갔음. 독려는 지연을 빨리 줄이지만 몰림을 거쳐 품질을 깎음(R3 독려의 역효과).");
    if(G.log.every(l=>l.lev.a<.5))tips.push("사전점검 적용률을 낮게 유지했음. 재작업을 줄이는 정보 흐름 개입은 비용 대비 효과가 큰 편임.");
    if(G.log[0].lev.early===0&&G.log.some(l=>l.lev.early>0))tips.push("조기화를 뒤늦게 적용했음. 연초에 앞당길수록 효과가 큼(지연 구조).");
    if(!tips.length)tips.push("부작용 경로를 잘 피했음. 어느 선택이 결과를 갈랐는지 정책 탐색 화면의 개입 지점별 효과와 비교해 볼 것.");
    fin=`<div class="panel"><h2>결과와 되짚기</h2><div class="grid g4"><div class="kpi"><span class="lab">내 종합 점수</span><span class="val">${p1(my)}</span><span class="sub">현행 유지 ${p1(base)} · 탐색된 최선 ${p1(best.pay)}</span></div><div class="kpi"><span class="lab">2개년 불용 합계</span><span class="val">${mil2(lap)}<small>백만원</small></span><span class="sub">현행 유지 ${mil2(m0.lapse)}</span></div><div class="kpi"><span class="lab">2차년 말 달성률</span><span class="val">${p1(b.P||0)}<small>%</small></span><span class="sub">현행 유지 ${p1(m0.P2)}%</span></div></div>
     ${tips.map(t=>`<div class="chk">${stPill("warn","되짚기")}<span>${t}</span></div>`).join("")}<div class="row"><button class="btn pri" data-act="gnew">다시 하기</button><a class="btn" style="text-decoration:none" href="#sdmap">인과지도에서 구조 확인</a></div></div>`}
  const idx=[];for(let i=0;i<G.h.t.length;i+=4)idx.push(i);
  return head("의사결정 훈련","석 달마다 정책을 정하고 결과를 확인하는 방식으로 사업 종료까지 운영해 봄. 지연과 누적 때문에 지금의 선택이 뒤늦게 나타나는 것을 직접 겪어 보는 화면임.")+`
  <div class="panel"><h2>진행 상황</h2>${steps([...G.log.map((l,i)=>[lab(l.from)+" ~",(i+1)+"회차",0]),...(done?[["종료","완료",1]]:[[lab(G.t)+" ~",(G.log.length+1)+"회차",1]])])}</div>
  <div class="grid g4"><div class="panel kpi"><span class="lab">당해 집행률</span><span class="val">${p1(last?G.h.rate[G.h.rate.length-1]:cur.rate)}<small>%</small></span><span class="sub">예산 잔액 ${mil2(cur.B)}백만원</span></div><div class="panel kpi"><span class="lab">집행 대기액</span><span class="val">${mil2(cur.W)}<small>백만원</small></span><span class="sub">구간 최대 재작업률 ${p1(cur.rw)}%</span></div>
   <div class="panel kpi"><span class="lab">성과 달성률</span><span class="val">${p1(cur.P)}<small>%</small></span><span class="sub">운영 품질 ${cur.Q.toFixed(2)}</span></div><div class="panel kpi"><span class="lab">누적 불용액</span><span class="val">${mil2(G.U)}<small>백만원</small></span><span class="sub">연말에 남은 잔액과 대기액</span></div></div>
  ${done?fin:`<div class="panel"><h2>${lab(G.t)}부터 석 달 동안의 정책</h2><div class="form" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${Object.entries(SD_LEV).map(([k,L])=>`<label for="gv_${k}"><span style="display:flex;justify-content:space-between;color:var(--fg);font-weight:700"><span>${L[0]}</span><output id="go_${k}">${L[5](G.lev[k])}</output></span><input type="range" id="gv_${k}" data-glev="${k}" min="${L[2]}" max="${L[3]}" step="${L[4]}" value="${G.lev[k]}"><span>${L[1]}</span></label>`).join("")}</div>
   <div class="row"><button class="btn pri" data-act="gstep">석 달 진행</button><button class="btn" data-act="gnew">처음부터</button></div></div>`}
  ${G.h.t.length>1?`<div class="grid g2"><div class="panel"><h2>집행률</h2>${lineChart({xs:idx.map(i=>lab(G.h.t[i]).slice(2).replace("-",".")),h:200,fmt:v=>Math.round(v)+"%",series:[{n:"계획 경로",c:"var(--muted)",v:idx.map(i=>G.h.plan[i]),thin:true,label:false,zero:true},{n:"집행률",c:"var(--s1)",v:idx.map(i=>G.h.rate[i]),zero:true}]})}</div>
   <div class="panel"><h2>성과 달성률과 재작업률</h2>${lineChart({xs:idx.map(i=>lab(G.h.t[i]).slice(2).replace("-",".")),h:200,fmt:v=>Math.round(v)+"%",series:[{n:"성과 달성률",c:"var(--s1)",v:idx.map(i=>G.h.P[i]),zero:true},{n:"재작업률",c:"var(--s2)",v:idx.map(i=>G.h.rw[i]),zero:true}]})}</div></div>
  <div class="panel"><h2>회차 기록</h2><div class="tw"><table><thead><tr><th>회차</th><th>기간</th><th>정책</th><th class="n">최고 집행률</th><th class="n">최대 재작업률</th><th class="n">달성률</th><th class="n">연말 불용</th></tr></thead><tbody>${G.log.map((l,i)=>`<tr><td>${i+1}</td><td>${lab(l.from)} ~ ${lab(l.to-.01)}</td><td>${levText(l.lev)}</td><td class="n">${p1(l.rate)}%</td><td class="n">${p1(l.rw)}%</td><td class="n">${p1(l.P)}%</td><td class="n">${l.lapse?mil2(l.lapse):"–"}</td></tr>`).join("")}</tbody></table></div></div>`:""}`};

function copy(text,el){const done=()=>{if(el)el.textContent="복사함. 엑셀이나 문서에 붙여넣을 수 있음."};
  try{navigator.clipboard.writeText(text).then(done,()=>fallback())}catch(e){fallback()}
  function fallback(){const t=document.createElement("textarea");t.value=text;document.body.append(t);t.select();try{document.execCommand("copy");done()}catch(e){}t.remove()}}

addEventListener("hashchange",()=>{const go=()=>{render(true);scrollTo(0,0)};if(document.startViewTransition&&!REDUCE){try{document.startViewTransition(go);return}catch(e){}}go()});

  else if(a==="rfill"){const t=S.tx.find(t=>t.id==d.id);if(t){$("#rf_d").value=t.date;$("#rf_p").value=t.prog;$("#rf_a").value=t.amount;$("#rf_v").value=t.vendor;$("#rf_d").focus()}}
  else if(a==="achdel"){S.achv=S.achv.filter(x=>x.id!=d.id);save();render()}
  else if(a==="simsave"){const c=simCalc();if(c&&c.x>0){const dd=new Date();dd.setDate(dd.getDate()+30);S.decisions.push({id:Math.max(0,...S.decisions.map(x=>x.id))+1,aid:"sim-"+Date.now(),date:ymd(new Date()),title:"예산 재배분 검토안",choice:`${c.a.p.name} → ${c.b.p.name} ${mil(c.x)}백만원`,reason:`전체 불용 예상 ${mil(c.rows[2][1]-c.rows[2][2])} → ${mil(c.rows[2][3]-c.rows[2][4])}백만원`,owner:"사업단 운영팀",review:ymd(dd),result:"대기"});save();$("#simmsg").textContent="결정 기록에 남김. 결정 안건 화면에서 확인할 수 있음."}else $("#simmsg").textContent="옮길 금액을 입력해야 함."}
  else if(a==="cldloop"){sd.loop=sd.loop===d.k?"":d.k;render()}
  else if(a==="cldreset"){sd.pos=null;sd.loop="";sd.node="";render()}
  else if(a==="sdsel"){sd.sel=d.k;render();$("#view .panel")?.scrollIntoView({block:"start",behavior:REDUCE?"auto":"smooth"})}
  else if(a==="sdeqreset"){const o=SD_VARS0.find(v=>v[0]===d.k);sd.vars=(sd.vars||SD_VARS0).map(v=>v[0]===d.k?[...o]:v);sd.cache={};render()}
  else if(a==="sdreset"){sd.vars=null;sd.ov={};sd.cache={};render()}
  else if(a==="sdpre"){sd.lev={base:{...SD0},push:{...SD0,k:3},staff:{...SD0,nAdd:2},check:{...SD0,a:1},mix:{...SD0,a:1,early:.4}}[d.k]||{...sdOpt()[0].lev};render()}
  else if(a==="sdapply"){sd.lev={...sdOpt()[+d.i].lev};location.hash="sdsim"}
  else if(a==="sdsave"){sd.saved.push({n:"안 "+(sd.saved.length+1),lev:{...sd.lev}});if(sd.saved.length>4)sd.saved.shift();$("#sdout").innerHTML=sdOut();$("#sdmsg").textContent="저장함. 비교표와 그래프에 표시됨."}
  else if(a==="sddec"){const m0=sdM(sdSim(SD0)),m=sdM(sdSim(sd.lev)),dd=new Date();dd.setDate(dd.getDate()+90);S.decisions.push({id:Math.max(0,...S.decisions.map(x=>x.id))+1,aid:"sdsim-"+Date.now(),date:ymd(new Date()),title:"집행·성과 구조 개선 정책(모의 기반)",choice:levText(sd.lev),reason:`모의 결과 1차년 불용 ${mil2(m0.lapse1)} → ${mil2(m.lapse1)}백만원, 2차년 말 달성률 ${p1(m0.P2)} → ${p1(m.P2)}%`,owner:"사업단 운영팀",review:ymd(dd),result:"대기"});save();$("#sdmsg").textContent="결정 기록에 남김. 결정 안건 화면에서 이행 여부를 관리함."}
  else if(a==="gstep"){gameStep();render()}
  else if(a==="gnew"){gameNew();render()}
  else if(a==="reset"){if(!resetArm){resetArm=true;b.textContent="한 번 더 누르면 현재 자료를 지우고 되돌림";return}resetArm=false;S=sampleState();save();render()}
});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.lev){const k=t.dataset.lev;if(k==="s"){sd.s=+t.value;$("#lo_s").textContent=sd.s.toFixed(1)}else{sd.lev[k]=+t.value;$("#lo_"+k).textContent=SD_LEV[k][5](sd.lev[k])}$("#sdout").innerHTML=sdOut();return}if(t.dataset.glev){const k=t.dataset.glev;sd.game.lev[k]=+t.value;$("#go_"+k).textContent=SD_LEV[k][5](+t.value);return}if(t.dataset.f){aForm[t.dataset.f]=t.type==="checkbox"?t.checked:t.value;aRefresh()}});
document.addEventListener("change",e=>{const t=e.target,a=t.dataset.act,d=t.dataset;
  if(t.id==="role"){S.role=t.value;syncRole();save();render()}
  else if(t.id==="roleDept"){S.roleDept=t.value;save();render()}
  else if(t.id==="up"){upload(t.files[0])}
  else if(a==="kact"){const k=S.kpis.find(k=>k.id===d.id);k.actual=+t.value||0;S.src.kpi="직접 입력";save();render()}
  else if(a==="fst"){const f=S.feedback.find(f=>f.id==d.id);if(t.value==="완료"&&!f.evidence.trim()){t.value=f.status;$("#fmsg").textContent="완료로 바꾸려면 완료 증빙을 먼저 적어야 함.";return}f.status=t.value;save();render()}
  else if(a==="fev"){S.feedback.find(f=>f.id==d.id).evidence=t.value;save()}
  else if(a==="evt"){S.evid.find(x=>x.id==d.id).ok=t.checked;save();render()}
  else if(a==="path"){pathSel=t.value;render()}
  else if(a==="sim"){sim[d.k]=d.k==="amt"?+t.value||0:t.value;render()}
  else if(a==="dst"){S.decisions.find(x=>x.id==d.id).result=t.value;save();render()}
  else if(a==="sdc"){if(t.value!==""&&isFinite(+t.value)){const old={...sd.ov};sd.ov[d.k]=+t.value;sd.cache={};try{sdSim(SD0,null,1);render()}catch(x){sd.ov=old;t.value="";t.placeholder="계산할 수 없는 값"}}}
  else if(a==="sdo"){sd.out=t.value;render()}
  else if(a==="rule"){S.rules[d.k]=+t.value||0;save();renderNav()}
  else if(a==="period"){if(t.value){S.period[d.k]=t.value;save()}}
});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target,v=id=>$("#"+id).value.trim();
  if(f.id==="askf"){ask(v("askq"));render();$("#askq")?.focus()}
  else if(f.id==="kbf"){S.kb.push({t:v("kb_t"),k:v("kb_k").split(",").map(s=>s.trim()).filter(Boolean),x:v("kb_x"),src:v("kb_s")});save();render()}
  else if(f.id==="ff"){S.feedback.push({id:Math.max(0,...S.feedback.map(x=>x.id))+1,src:v("ff_s"),text:v("ff_t"),owner:v("ff_o"),due:v("ff_d"),status:"접수",evidence:""});save();render()}
  else if(f.id==="tf"){S.tasks.push({id:Math.max(0,...S.tasks.map(x=>x.id))+1,due:v("tf_d"),text:v("tf_t")});save();render()}
  else if(f.dataset.form==="decide"){const id=f.dataset.id,o=f.querySelector("input[type=radio]:checked");if(o){S.decisions.push({id:Math.max(0,...S.decisions.map(x=>x.id))+1,aid:id,date:ymd(new Date()),title:f.dataset.title,choice:o.value,reason:v("dr_"+id),owner:v("do_"+id),review:v("dd_"+id),result:"대기"});save();render()}}
  else if(f.id==="rf"){const rec={id:Math.max(0,...S.receipts.map(x=>x.id))+1,date:v("rf_d"),prog:v("rf_p"),amount:+v("rf_a"),vendor:v("rf_v"),kind:v("rf_k"),img:""};thumb($("#rf_i").files[0],img=>{rec.img=img;S.receipts.push(rec);save();render()})}
  else if(f.id==="achf"){S.achv.push({id:Math.max(0,...S.achv.map(x=>x.id))+1,date:v("ach_d"),prog:v("ach_p"),title:v("ach_t"),evidence:v("ach_e")});save();render()}
  else if(f.dataset.form==="sdeq"){const k=f.dataset.k,ex=v("sdeq_in"),nv=(sd.vars||SD_VARS0).map(x=>x[0]===k?[x[0],x[1],x[2],x[3],ex]:x);try{const {C,t0}=sdCalib();sdRun({...C,...SD0},t0,24,nv);sd.vars=nv;sd.cache={};sd.err="";render()}catch(x){$("#sdeqmsg").textContent="적용하지 못함. "+x.message}}
  else if(f.dataset.form==="evadd"){const x=v("eva_"+f.dataset.k);if(x){S.evid.push({id:Math.max(0,...S.evid.map(x=>x.id))+1,kpi:f.dataset.k,doc:x,ok:false});save();render()}}
});
const tip=$("#tip");
document.addEventListener("pointermove",e=>{const t=e.target.closest?.("[data-tip]");if(!t||!t.dataset.tip){tip.hidden=true;return}tip.textContent=t.dataset.tip;tip.hidden=false;
  const w=tip.offsetWidth;tip.style.left=Math.max(4,Math.min(innerWidth-w-4,e.clientX+12))+"px";tip.style.top=Math.max(4,e.clientY-tip.offsetHeight-10)+"px"});
document.addEventListener("pointerleave",()=>tip.hidden=true);

function syncRole(){$("#role").value=S.role;const d=$("#roleDept"),ds=[...new Set(S.programs.map(p=>p.dept))];d.hidden=S.role!=="dept";
  if(!ds.includes(S.roleDept))S.roleDept=ds[0]||"";d.innerHTML=ds.map(x=>`<option ${x===S.roleDept?"selected":""}>${esc(x)}</option>`).join("")}

/* ---- 자료 올리기 ---- */
function upload(file){const m=$("#upmsg");if(!file)return;if(typeof XLSX==="undefined"){m.textContent="엑셀 읽기 도구를 불러오지 못함. 네트워크를 확인한 뒤 다시 시도할 것.";return}
  const fr=new FileReader();fr.onload=()=>{try{const wb=XLSX.read(new Uint8Array(fr.result),{type:"array",cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
    m.textContent=importRows(rows);save();renderNav()}catch(x){m.textContent="파일을 읽지 못함. 첫 번째 시트의 첫 행에 열 이름이 있는지 확인할 것."}};fr.readAsArrayBuffer(file)}
function importRows(rows){if(!rows.length)return "자료 행이 없음.";const keys=Object.keys(rows[0]).map(k=>k.trim()),has=k=>keys.includes(k),g=(r,k)=>{for(const x in r)if(x.trim()===k)return r[x];return ""};
  const num=v=>+String(v).replace(/[^\d.-]/g,"")||0,dt=v=>v instanceof Date?ymd(new Date(v.getTime()-v.getTimezoneOffset()*6e4)):String(v).trim().replace(/[./]/g,"-").slice(0,10);
  if(has("예산")&&has("프로그램")){const ps=rows.map((r,i)=>({id:String(g(r,"코드")||"P"+String(i+1).padStart(2,"0")).trim(),name:String(g(r,"프로그램")).trim(),area:String(g(r,"영역")||"미분류").trim(),dept:String(g(r,"부서")||"미지정").trim(),budget:num(g(r,"예산"))})).filter(p=>p.name&&p.budget>0);
    if(!ps.length)return "예산 배정으로 읽을 수 있는 행이 없음.";S.programs=ps;S.tx=S.tx.filter(t=>prog(t.prog));syncRole();return `예산 배정 ${ps.length}개 프로그램을 반영함. 프로그램 코드가 달라진 집행 내역은 제외됨.`}
  if(has("금액")&&has("집행일")){const out=[];let bad=0,id=1;for(const r of rows){const pn=String(g(r,"프로그램")).trim(),p=S.programs.find(p=>p.name===pn||p.id===pn),d=dt(g(r,"집행일")),a=num(g(r,"금액"));
      if(!p||!/^\d{4}-\d{2}-\d{2}$/.test(d)||!a){bad++;continue}const ac=String(g(r,"계좌")).replace(/\D/g,"");
      out.push({id:id++,date:d,prog:p.id,item:String(g(r,"비목")||"미분류").trim(),amount:a,vendor:String(g(r,"거래처")||"미기재").trim(),acct:ac?"AC-"+hash("acct"+ac).slice(0,4):"",memo:String(g(r,"적요")).trim()})}
    if(!out.length)return `읽을 수 있는 행이 없음. 프로그램 이름이 예산 배정과 같은지, 집행일이 연-월-일 형식인지 확인할 것. (제외 ${bad}행)`;
    S.tx=out;S.items=[...new Set(out.map(t=>t.item))];S.src.tx="업로드 "+ymd(new Date());S.review={};return `집행 내역 ${out.length}건을 반영함.${bad?` 프로그램·일자·금액을 읽지 못한 ${bad}행은 제외함.`:""} 계좌번호는 비교용 기호로 바꿔 저장함.`}
  return "열 이름을 알아보지 못함. 집행 내역은 '집행일'과 '금액', 예산 배정은 '프로그램'과 '예산' 열이 필요함."}

syncRole();render(true);
</script>
